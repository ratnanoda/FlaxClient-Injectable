name: Publish Single-File Release Fixed

on:
  push:
    branches:
      - chatgpt/games-overhaul-20260803
    paths:
      - .github/workflows/publish-single-file-release-fixed.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: "30769926640"
      SOURCE_ARTIFACT: FlaxClient-Media-Reinject-Fix-Lunar-1.8.9-Windows-x64
      RELEASE_TAG: v2026.08.03.1
      RELEASE_ASSET: FlaxInjector-Public-Single-File-Lunar-1.8.9.exe
      MAGIC: FLAXPKG1PUBLIC!!
    steps:
      - name: Mark release pending
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=pending `
            -f context=release/single-file-fixed `
            -f description="Building and uploading the single-file release" `
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Download verified runtime artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "build\runtime" | Out-Null
          gh run download $env:SOURCE_RUN_ID `
            --repo "${{ github.repository }}" `
            --name $env:SOURCE_ARTIFACT `
            --dir "build\runtime"

          foreach ($file in @(
            "build\runtime\FlaxInjector.exe",
            "build\runtime\FlaxClient.dll",
            "build\runtime\tools\yt-dlp.exe",
            "build\runtime\tools\deno.exe",
            "build\runtime\tools\ffmpeg.exe",
            "build\runtime\tools\ffprobe.exe"
          )) {
            if (!(Test-Path $file)) { throw "Missing runtime file: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty runtime file: $file" }
          }

      - name: Build embedded runtime archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @"
          FlaxClient single-file public package for Lunar Client OptiFine 1.8.9.
          The launcher verifies and extracts the bundled runtime before starting it.
          Start injection only after the Lunar 1.8.9 main menu is visible.
          "@ | Set-Content -Encoding UTF8 "build\runtime\README-PUBLIC.txt"

          Compress-Archive `
            -Path "build\runtime\*" `
            -DestinationPath "build\runtime.zip" `
            -CompressionLevel Optimal `
            -Force

          $size = (Get-Item "build\runtime.zip").Length
          if ($size -lt 100000000) { throw "Runtime archive is unexpectedly small: $size" }
          Write-Host "Runtime ZIP: $size bytes"

      - name: Build launcher stub
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = @'
          package main

          import (
              "archive/zip"
              "crypto/sha256"
              "encoding/binary"
              "encoding/hex"
              "errors"
              "fmt"
              "io"
              "os"
              "os/exec"
              "path/filepath"
              "strings"
              "syscall"
              "unsafe"
          )

          const footerSize int64 = 64
          const magic = "FLAXPKG1PUBLIC!!"

          var required = []string{
              "FlaxInjector.exe",
              "FlaxClient.dll",
              "tools/yt-dlp.exe",
              "tools/deno.exe",
              "tools/ffmpeg.exe",
              "tools/ffprobe.exe",
          }

          type metadata struct {
              offset int64
              length int64
              hash [32]byte
          }

          func main() {
              if err := run(); err != nil {
                  showError(err.Error())
                  os.Exit(1)
              }
          }

          func run() error {
              executable, err := os.Executable()
              if err != nil { return err }
              executable, err = filepath.Abs(executable)
              if err != nil { return err }

              file, data, err := openEmbedded(executable)
              if err != nil { return err }
              defer file.Close()

              reader, err := zip.NewReader(io.NewSectionReader(file, data.offset, data.length), data.length)
              if err != nil { return fmt.Errorf("cannot open embedded runtime: %w", err) }
              if err := verifyNames(reader); err != nil { return err }

              if len(os.Args) > 1 && os.Args[1] == "--verify-bundle" { return nil }

              local := os.Getenv("LOCALAPPDATA")
              if local == "" { return errors.New("LOCALAPPDATA is unavailable") }
              expected := hex.EncodeToString(data.hash[:])
              target := filepath.Join(local, "FlaxClient", "runtime", "v2026.08.03.1-"+expected[:12])

              ready, err := isReady(target, expected)
              if err != nil { return err }
              if !ready {
                  if err := extract(reader, target, expected); err != nil { return err }
              }

              command := exec.Command(filepath.Join(target, "FlaxInjector.exe"), os.Args[1:]...)
              command.Dir = target
              return command.Start()
          }

          func openEmbedded(path string) (*os.File, metadata, error) {
              var data metadata
              file, err := os.Open(path)
              if err != nil { return nil, data, err }
              stat, err := file.Stat()
              if err != nil { file.Close(); return nil, data, err }
              if stat.Size() < footerSize {
                  file.Close()
                  return nil, data, errors.New("embedded runtime footer is missing")
              }

              footer := make([]byte, footerSize)
              if _, err := file.ReadAt(footer, stat.Size()-footerSize); err != nil {
                  file.Close(); return nil, data, err
              }
              if string(footer[:16]) != magic {
                  file.Close()
                  return nil, data, errors.New("embedded runtime signature is invalid")
              }

              data.offset = int64(binary.LittleEndian.Uint64(footer[16:24]))
              data.length = int64(binary.LittleEndian.Uint64(footer[24:32]))
              copy(data.hash[:], footer[32:64])
              if data.offset < 0 || data.length <= 0 || data.offset+data.length+footerSize != stat.Size() {
                  file.Close()
                  return nil, data, errors.New("embedded runtime bounds are invalid")
              }

              hash := sha256.New()
              if _, err := io.Copy(hash, io.NewSectionReader(file, data.offset, data.length)); err != nil {
                  file.Close(); return nil, data, err
              }
              if !same(hash.Sum(nil), data.hash[:]) {
                  file.Close()
                  return nil, data, errors.New("embedded runtime SHA-256 verification failed")
              }
              return file, data, nil
          }

          func verifyNames(reader *zip.Reader) error {
              names := map[string]bool{}
              for _, entry := range reader.File {
                  names[strings.ReplaceAll(entry.Name, "\\", "/")] = true
              }
              for _, name := range required {
                  if !names[name] { return fmt.Errorf("embedded runtime is missing %s", name) }
              }
              return nil
          }

          func isReady(target, expected string) (bool, error) {
              marker, err := os.ReadFile(filepath.Join(target, ".bundle.sha256"))
              if err != nil {
                  if os.IsNotExist(err) { return false, nil }
                  return false, err
              }
              if strings.TrimSpace(string(marker)) != expected { return false, nil }
              for _, name := range required {
                  stat, err := os.Stat(filepath.Join(target, filepath.FromSlash(name)))
                  if err != nil || stat.IsDir() || stat.Size() <= 0 { return false, nil }
              }
              return true, nil
          }

          func extract(reader *zip.Reader, target, expected string) error {
              temporary := fmt.Sprintf("%s.tmp-%d", target, os.Getpid())
              _ = os.RemoveAll(temporary)
              if err := os.MkdirAll(temporary, 0755); err != nil { return err }
              complete := false
              defer func() { if !complete { _ = os.RemoveAll(temporary) } }()

              for _, entry := range reader.File {
                  clean := filepath.Clean(filepath.FromSlash(entry.Name))
                  if clean == "." || clean == ".." || filepath.IsAbs(clean) || strings.HasPrefix(clean, ".."+string(os.PathSeparator)) {
                      return fmt.Errorf("unsafe embedded path: %s", entry.Name)
                  }
                  destination := filepath.Join(temporary, clean)
                  relative, err := filepath.Rel(temporary, destination)
                  if err != nil || relative == ".." || strings.HasPrefix(relative, ".."+string(os.PathSeparator)) {
                      return fmt.Errorf("unsafe embedded path: %s", entry.Name)
                  }
                  if entry.FileInfo().IsDir() {
                      if err := os.MkdirAll(destination, 0755); err != nil { return err }
                      continue
                  }
                  if err := os.MkdirAll(filepath.Dir(destination), 0755); err != nil { return err }
                  input, err := entry.Open()
                  if err != nil { return err }
                  output, err := os.OpenFile(destination, os.O_CREATE|os.O_TRUNC|os.O_WRONLY, 0755)
                  if err != nil { input.Close(); return err }
                  _, copyErr := io.Copy(output, input)
                  outputErr := output.Close()
                  inputErr := input.Close()
                  if copyErr != nil { return copyErr }
                  if outputErr != nil { return outputErr }
                  if inputErr != nil { return inputErr }
              }

              if err := os.WriteFile(filepath.Join(temporary, ".bundle.sha256"), []byte(expected+"\n"), 0644); err != nil { return err }
              _ = os.RemoveAll(target)
              if err := os.MkdirAll(filepath.Dir(target), 0755); err != nil { return err }
              if err := os.Rename(temporary, target); err != nil { return err }
              complete = true
              return nil
          }

          func same(left, right []byte) bool {
              if len(left) != len(right) { return false }
              var value byte
              for index := range left { value |= left[index] ^ right[index] }
              return value == 0
          }

          func showError(text string) {
              user32 := syscall.NewLazyDLL("user32.dll")
              procedure := user32.NewProc("MessageBoxW")
              title, _ := syscall.UTF16PtrFromString("FlaxClient Launcher")
              message, _ := syscall.UTF16PtrFromString(text)
              procedure.Call(0, uintptr(unsafe.Pointer(message)), uintptr(unsafe.Pointer(title)), 0x10)
          }
          '@

          New-Item -ItemType Directory -Force -Path "build\launcher" | Out-Null
          [System.IO.File]::WriteAllText(
            "build\launcher\main.go",
            $source,
            (New-Object System.Text.UTF8Encoding($false)))

          go build -trimpath -ldflags "-H windowsgui -s -w" `
            -o "build\launcher\stub.exe" `
            "build\launcher\main.go"

          if (!(Test-Path "build\launcher\stub.exe")) { throw "Launcher stub was not generated" }

      - name: Assemble and verify single executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stubPath = "build\launcher\stub.exe"
          $zipPath = "build\runtime.zip"
          $outputPath = Join-Path "build" $env:RELEASE_ASSET
          $stubLength = (Get-Item $stubPath).Length
          $zipLength = (Get-Item $zipPath).Length

          $sha = [System.Security.Cryptography.SHA256]::Create()
          $zipInput = [System.IO.File]::OpenRead($zipPath)
          try { $zipHash = $sha.ComputeHash($zipInput) }
          finally { $zipInput.Dispose(); $sha.Dispose() }

          $footer = New-Object byte[] 64
          $magicBytes = [System.Text.Encoding]::ASCII.GetBytes($env:MAGIC)
          if ($magicBytes.Length -ne 16) { throw "Magic must be exactly 16 bytes" }
          [System.Array]::Copy($magicBytes, 0, $footer, 0, 16)
          [System.BitConverter]::GetBytes([Int64]$stubLength).CopyTo($footer, 16)
          [System.BitConverter]::GetBytes([Int64]$zipLength).CopyTo($footer, 24)
          [System.Array]::Copy($zipHash, 0, $footer, 32, 32)

          $output = [System.IO.File]::Open($outputPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            $input = [System.IO.File]::OpenRead($stubPath)
            try { $input.CopyTo($output) } finally { $input.Dispose() }
            $input = [System.IO.File]::OpenRead($zipPath)
            try { $input.CopyTo($output) } finally { $input.Dispose() }
            $output.Write($footer, 0, $footer.Length)
          }
          finally { $output.Dispose() }

          $verification = Start-Process -FilePath $outputPath -ArgumentList "--verify-bundle" -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw "Bundle verification failed: $($verification.ExitCode)" }

          $size = (Get-Item $outputPath).Length
          if ($size -lt 100000000) { throw "Final executable is unexpectedly small: $size" }
          $hash = (Get-FileHash $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:RELEASE_ASSET" | Set-Content -Encoding ASCII "build\SHA256SUMS.txt"
          Write-Host "Final executable: $size bytes"
          Write-Host "SHA-256: $hash"

      - name: Create public GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          @"
          ## FlaxClient single-file public build

          - Target: Lunar Client OptiFine 1.8.9 / Windows x64
          - One EXE containing FlaxClient.dll, Injector, yt-dlp, Deno, FFmpeg and FFprobe
          - Embedded runtime is SHA-256 verified before extraction
          - No password or account authentication

          Start injection only after the Lunar 1.8.9 main menu is visible.

          The executable is unsigned, so Windows SmartScreen or security software may display a warning.
          "@ | Set-Content -Encoding UTF8 "build\RELEASE-NOTES.md"

          gh release create $env:RELEASE_TAG `
            (Join-Path "build" $env:RELEASE_ASSET) `
            "build\SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "FlaxClient Single-File Injector - Lunar 1.8.9" `
            --notes-file "build\RELEASE-NOTES.md" `
            --latest

      - name: Report final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") { "GitHub Release and EXE published" } else { "Single-file release workflow failed" }
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=$state `
            -f context=release/single-file-fixed `
            -f description=$description `
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
