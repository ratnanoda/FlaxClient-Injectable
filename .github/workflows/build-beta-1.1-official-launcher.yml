name: Fetch beta 1.1 release launcher

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  fetch-release:
    runs-on: windows-latest
    steps:
      - name: Find and download release EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $api = "https://api.github.com/repos/ratnanoda/FlaxClient-Injectable/releases/tags/flaxclient-beta-1.1"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          Write-Host "Release: $($release.name) / $($release.tag_name)"
          foreach ($a in $release.assets) {
            Write-Host "Asset: $($a.name) id=$($a.id) size=$($a.size)"
          }
          $asset = $release.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -First 1
          if (-not $asset) { throw "No EXE asset found on beta 1.1 release" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "dist/FlaxClientLauncher-beta-1.1-release.exe"
          $assetHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest -Uri $asset.url -Headers $assetHeaders -OutFile $out
          $f = Get-Item $out
          Write-Host "Downloaded asset: $($asset.name)"
          Write-Host "Release launcher size: $($f.Length) bytes"
          $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Release asset is not a Windows PE executable" }
          Get-FileHash $f.FullName -Algorithm SHA256

      - name: Upload release launcher
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClientLauncher-beta-1.1-release
          path: dist/FlaxClientLauncher-beta-1.1-release.exe
          if-no-files-found: error
