name: Fetch beta 1.1 release launcher

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  fetch-release:
    runs-on: windows-latest
    steps:
      - name: Download release launcher
        shell: pwsh
        run: |
          $url = "https://github.com/ratnanoda/FlaxClient-Injectable/releases/download/flaxclient-beta-1.1/FlaxClientLauncher-windows-x86_64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          curl.exe -L --fail --retry 3 -o "dist/FlaxClientLauncher-windows-x86_64.exe" $url
          if ($LASTEXITCODE -ne 0) { throw "Release asset download failed" }
          $f = Get-Item "dist/FlaxClientLauncher-windows-x86_64.exe"
          Write-Host "Release launcher size: $($f.Length) bytes"
          $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Release asset is not a Windows PE executable" }
          Get-FileHash $f.FullName -Algorithm SHA256

      - name: Upload release launcher
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClientLauncher-beta-1.1-release
          path: dist/FlaxClientLauncher-windows-x86_64.exe
          if-no-files-found: error
