name: Build Clean Single-EXE Injector

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Build Lunar-compatible client jar
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" lunarJar --no-daemon --stacktrace
          if (!(Test-Path "build\libs\FlaxClient-Lunar.jar")) {
            throw "FlaxClient-Lunar.jar was not generated"
          }

      - name: Create injector-only client jar
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $source = (Resolve-Path "build\libs\FlaxClient-Lunar.jar").Path
          $destination = Join-Path (Split-Path $source) "FlaxClient-Lunar-Injector.jar"
          $excluded = @(
            "assets/minecraft/soar/tools/windows-x64/yt-dlp.exe",
            "assets/minecraft/soar/tools/windows-x64/ffmpeg.zip"
          )

          if (Test-Path $destination) {
            Remove-Item $destination -Force
          }

          $inputArchive = [System.IO.Compression.ZipFile]::OpenRead($source)
          try {
            $outputArchive = [System.IO.Compression.ZipFile]::Open(
              $destination,
              [System.IO.Compression.ZipArchiveMode]::Create
            )
            try {
              foreach ($entry in $inputArchive.Entries) {
                if ($excluded -contains $entry.FullName) {
                  Write-Host "Excluded non-injector payload: $($entry.FullName)"
                  continue
                }

                $newEntry = $outputArchive.CreateEntry(
                  $entry.FullName,
                  [System.IO.Compression.CompressionLevel]::Optimal
                )
                $newEntry.LastWriteTime = $entry.LastWriteTime

                if ($entry.FullName.EndsWith("/")) {
                  continue
                }

                $sourceStream = $entry.Open()
                try {
                  $destinationStream = $newEntry.Open()
                  try {
                    $sourceStream.CopyTo($destinationStream)
                  } finally {
                    $destinationStream.Dispose()
                  }
                } finally {
                  $sourceStream.Dispose()
                }
              }
            } finally {
              $outputArchive.Dispose()
            }
          } finally {
            $inputArchive.Dispose()
          }

          if (!(Test-Path $destination)) {
            throw "Injector-only jar was not generated"
          }

          $entries = & jar tf $destination
          foreach ($path in $excluded) {
            if ($entries -contains $path) {
              throw "Excluded payload remains in injector jar: $path"
            }
          }
          if ($entries -notcontains "me/eldodebug/soar/attach/AttachBootstrap.class") {
            throw "Attach bootstrap is missing from injector jar"
          }
          if ($entries -notcontains "me/eldodebug/soar/attach/LateHooks.class") {
            throw "Attach hooks are missing from injector jar"
          }

          Write-Host "Original jar bytes: $((Get-Item $source).Length)"
          Write-Host "Injector jar bytes: $((Get-Item $destination).Length)"

      - name: Configure clean injector build
        shell: powershell
        run: |
          $jar = (Resolve-Path "build\libs\FlaxClient-Lunar-Injector.jar").Path.Replace('\', '/')
          cmake -S attach -B attach/build-clean -A x64 "-DFLAX_CLIENT_JAR=$jar"

      - name: Build embedded DLL and injector EXE
        shell: powershell
        run: cmake --build attach/build-clean --config Release --target FlaxInjector

      - name: Verify injector package
        shell: powershell
        run: |
          $exe = "attach\build-clean\bin\Release\FlaxClient.exe"
          $dll = "attach\build-clean\bin\Release\FlaxClient.dll"
          if (!(Test-Path $exe)) { throw "Injector EXE was not generated" }
          if (!(Test-Path $dll)) { throw "Intermediate DLL was not generated" }

          $verification = Start-Process -FilePath $exe -ArgumentList "--verify-embedded" -Wait -PassThru
          if ($verification.ExitCode -ne 0) {
            throw "The EXE could not verify or extract its embedded DLL"
          }

          if ((Get-Item $exe).Length -le (Get-Item $dll).Length) {
            throw "The final EXE does not appear to contain the DLL resource"
          }

          $runtime = @(
            Get-ChildItem "$env:LOCALAPPDATA\FlaxClient\runtime\FlaxClient-*.dll" `
              -File -ErrorAction SilentlyContinue
          )
          if ($runtime.Count -lt 1) {
            throw "The embedded DLL was not materialized under LocalAppData"
          }

          $version = (Get-Item $exe).VersionInfo
          Write-Host "File description: $($version.FileDescription)"
          Write-Host "Product version: $($version.ProductVersion)"
          Write-Host "Authenticode status: $((Get-AuthenticodeSignature $exe).Status)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Scan final EXE with Microsoft Defender
        shell: powershell
        run: |
          $exe = (Resolve-Path "attach\build-clean\bin\Release\FlaxClient.exe").Path
          $defender = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $defender)) {
            Write-Warning "Microsoft Defender command-line scanner is unavailable on this runner."
            exit 0
          }

          & $defender -SignatureUpdate
          $scan = Start-Process -FilePath $defender `
            -ArgumentList @("-Scan", "-ScanType", "3", "-File", $exe, "-DisableRemediation") `
            -Wait -PassThru -NoNewWindow

          if ($scan.ExitCode -eq 2) {
            throw "Microsoft Defender detected the generated injector EXE"
          }
          if ($scan.ExitCode -ne 0) {
            throw "Microsoft Defender scan failed with exit code $($scan.ExitCode)"
          }

      - name: Stage one-file injector distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build\clean-injector" | Out-Null
          Copy-Item "attach\build-clean\bin\Release\FlaxClient.exe" `
            "build\clean-injector\FlaxInjector.exe"

          $files = @(Get-ChildItem "build\clean-injector" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "FlaxInjector.exe") {
            throw "Distribution must contain exactly one FlaxInjector.exe"
          }

      - name: Upload clean injector EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlaxInjector-Clean-Single-EXE-Windows-x64
          path: build/clean-injector/FlaxInjector.exe
          if-no-files-found: error
          retention-days: 7
