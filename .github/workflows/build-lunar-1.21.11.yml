name: Build Lunar 1.21.11 Fabric Client

on:
  push:
    branches:
      - agent/lunar-1.21.11-bootstrap
    paths:
      - 'lunar-1.21.11/**'
      - '.github/workflows/build-lunar-1.21.11.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lunar-1.21.11/**'
      - '.github/workflows/build-lunar-1.21.11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Fabric client mod
        run: gradle -p lunar-1.21.11 build --stacktrace

      - name: Stage distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lunar-1.21.11/build/distribution
          jar_path="$(find lunar-1.21.11/build/libs -maxdepth 1 -type f -name 'FlaxClient-Lunar-1.21.11-*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar_path"
          cp "$jar_path" lunar-1.21.11/build/distribution/FlaxClient-Lunar-1.21.11.jar
          jar tf lunar-1.21.11/build/distribution/FlaxClient-Lunar-1.21.11.jar | grep -q '^fabric.mod.json$'
          sha256sum lunar-1.21.11/build/distribution/FlaxClient-Lunar-1.21.11.jar

      - name: Upload Lunar-compatible JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-Lunar-1.21.11-Fabric
          path: lunar-1.21.11/build/distribution/FlaxClient-Lunar-1.21.11.jar
          if-no-files-found: error
          retention-days: 14
