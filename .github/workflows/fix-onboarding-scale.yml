name: Fix Ghost onboarding scale

on:
  push:
    branches:
      - chatgpt/beginner-guide-single-exe-20260803
    paths:
      - .github/workflows/fix-onboarding-scale.yml
  pull_request:
    branches:
      - chatgpt/unify-youtube-music-20260803

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/beginner-guide-single-exe-20260803
          fetch-depth: 0
      - name: Fix NanoVG scale call
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/me/eldodebug/soar/gui/modmenu/category/impl/ModuleCategory.java')
          text = path.read_text(encoding='utf-8')
          old = '''\t\tnvg.save();
\t\tnvg.translate(bubbleX + bubbleWidth / 2.0F, bubbleY + bubbleHeight / 2.0F);
\t\tnvg.scale(scale, scale);
\t\tnvg.translate(-bubbleX - bubbleWidth / 2.0F, -bubbleY - bubbleHeight / 2.0F);
'''
          new = '''\t\tnvg.save();
\t\tnvg.scale(bubbleX, bubbleY, bubbleWidth, bubbleHeight, scale);
'''
          if old not in text:
              raise SystemExit('Ghost tutorial scale marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/me/eldodebug/soar/gui/modmenu/category/impl/ModuleCategory.java
          git commit -m "Fix Ghost resize tutorial scaling"
          git push origin HEAD:chatgpt/beginner-guide-single-exe-20260803
