name: Apply Tetris grouping and Deject

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply requested changes
        shell: bash
        run: |
          cat .github/patches/deject3.b64.part* | base64 -d | gzip -d > /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply.py')
          source = path.read_text()
          source = source.replace(
              "'''    public long getContext() {\n        return nvg;\n    }\n}'''",
              "'''\tpublic long getContext() {\n\t\treturn nvg;\n\t}\n}'''")
          path.write_text(source)
          PY
          python3 /tmp/apply.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src attach .github/workflows/build-games-overhaul-lunar.yml
          git commit -m "Add grouped Tetris pieces and animated deject"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
