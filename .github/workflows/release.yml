name: Release FlaxClient 1.8.9

on:
  pull_request:
  push:
    branches:
      - "fix/generic-1.8.9-injection"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build embedded Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Build 1.8.9 client and embedded launcher
        shell: pwsh
        run: .\gradlew.bat attachPackage --stacktrace

      - name: Prepare Beta 1.3 release assets
        if: github.ref == 'refs/heads/fix/generic-1.8.9-injection'
        shell: pwsh
        run: |
          $source = Join-Path $PWD "build/attach/FlaxClient.exe"
          $exe = Join-Path $PWD "FlaxClient-Injector-Beta-1.3.exe"
          $sha = Join-Path $PWD "FlaxClient-Injector-Beta-1.3.sha256"
          if (-not (Test-Path $source)) {
            throw "Built executable was not found: $source"
          }
          Copy-Item $source $exe -Force
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  FlaxClient-Injector-Beta-1.3.exe" | Set-Content -Path $sha -Encoding ascii
          Write-Host "Release SHA256: $digest"

      - name: Publish FlaxClient Injector Beta 1.3
        if: github.ref == 'refs/heads/fix/generic-1.8.9-injection'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flaxclient-beta-1.3
          name: FlaxClient Injector Beta 1.3
          target_commitish: 704eb8322b440c90900045b9655c3b6ba1399224
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            FlaxClient-Injector-Beta-1.3.exe
            FlaxClient-Injector-Beta-1.3.sha256
          body: |
            # FlaxClient Injector Beta 1.3

            Windows x64 single-file injector for Minecraft 1.8.9.

            ## Highlights
            - Client-brand-independent process discovery; no Lunar, Dawn, or Feather window-name requirement.
            - Detects the Minecraft game JVM using Java/JVM and LWJGL 2-era native runtime signals.
            - Supports standard Minecraft 1.8.9 MCP, SRG, and Notch mapping namespaces at runtime.
            - Includes all three 1.8.9 payload variants in the single executable.
            - Includes a SHA-256 checksum asset.

            ## Notes
            - Start Minecraft 1.8.9 and wait for the main menu before launching the injector.
            - Windows x64 only.
            - Badlion remains unsupported by this build.

      - name: Encode FlaxClient.exe as Base64 text for v* tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/attach/FlaxClient.exe"
          $out = Join-Path $PWD "FlaxClient.exe.b64.txt"
          if (-not (Test-Path $exe)) {
            throw "Built executable was not found: $exe"
          }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $base64 = [Convert]::ToBase64String($bytes)
          [IO.File]::WriteAllText($out, $base64, [Text.Encoding]::ASCII)

      - name: Create GitHub Release for v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlaxClient.exe.b64.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
