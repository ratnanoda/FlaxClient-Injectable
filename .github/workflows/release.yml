name: Release launcher binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jar:
    name: Build FlaxClient jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Build with Gradle Wrapper
        run: chmod +x ./gradlew && ./gradlew build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: flaxclient-jar
          path: build/libs/FlaxClient-Release.jar
          if-no-files-found: error

  build-launcher:
    name: Build launcher (${{ matrix.label }})
    needs: build-jar
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: FlaxClientLauncher-windows-x86_64.exe
            binary_name: flax-client-launcher.exe
          - label: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: FlaxClientLauncher-linux-x86_64
            binary_name: flax-client-launcher
          - label: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            asset_name: FlaxClientLauncher-macos-x86_64
            binary_name: flax-client-launcher
          - label: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            asset_name: FlaxClientLauncher-macos-aarch64
            binary_name: flax-client-launcher
    steps:
      - uses: actions/checkout@v4

      - name: Download FlaxClient jar
        uses: actions/download-artifact@v4
        with:
          name: flaxclient-jar
          path: build/libs

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: FlaxClientLauncher

      - name: Build launcher
        working-directory: FlaxClientLauncher
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "FlaxClientLauncher/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "FlaxClientLauncher/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  macos-universal:
    name: Build universal macOS binary
    needs: build-launcher
    runs-on: macos-14
    steps:
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: FlaxClientLauncher-macos-x86_64
          path: macos-x86_64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: FlaxClientLauncher-macos-aarch64
          path: macos-aarch64

      - name: Combine with lipo
        run: |
          mkdir -p dist
          lipo -create \
            macos-x86_64/FlaxClientLauncher-macos-x86_64 \
            macos-aarch64/FlaxClientLauncher-macos-aarch64 \
            -output dist/FlaxClientLauncher-macos-universal
          chmod +x dist/FlaxClientLauncher-macos-universal
          lipo -info dist/FlaxClientLauncher-macos-universal

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClientLauncher-macos-universal
          path: dist/FlaxClientLauncher-macos-universal
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-launcher, macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all launcher artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: FlaxClientLauncher-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
