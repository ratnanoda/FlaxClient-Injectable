name: Release FlaxClient 1.8.9

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build embedded Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Build 1.8.9 client and embedded launcher
        shell: pwsh
        run: .\gradlew.bat attachPackage --stacktrace

      - name: Encode FlaxClient.exe as Base64 text
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/attach/FlaxClient.exe"
          $out = Join-Path $PWD "FlaxClient.exe.b64.txt"
          if (-not (Test-Path $exe)) {
            throw "Built executable was not found: $exe"
          }

          $bytes = [IO.File]::ReadAllBytes($exe)
          $base64 = [Convert]::ToBase64String($bytes)
          [IO.File]::WriteAllText($out, $base64, [Text.Encoding]::ASCII)

          Write-Host "EXE bytes: $($bytes.Length)"
          Write-Host "Base64 chars: $($base64.Length)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload Base64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-exe-base64
          path: FlaxClient.exe.b64.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlaxClient.exe.b64.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
