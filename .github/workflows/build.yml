name: Build beta 1.1 with Leapal FlaxClient

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-launcher:
    name: Build Leapal beta 1.1 launcher (Windows x86_64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout beta 1.1 source
        uses: actions/checkout@v4
        with:
          ref: flaxclient-beta-1.1
          path: beta

      - name: Download Leapal launcher
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "Leapal-FlaxClientLauncher.exe"
          $urls = @(
            "https://leapal.net/downloads/flax",
            "https://leapal-portal.onrender.com/downloads/flax"
          )

          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Trying $url"
            & curl.exe -fL --retry 4 --retry-delay 5 --max-time 240 $url -o $out
            if ($LASTEXITCODE -eq 0 -and (Test-Path $out) -and (Get-Item $out).Length -gt 1000000) {
              $downloaded = $true
              break
            }
          }

          if (-not $downloaded) {
            throw "Could not download the Leapal FlaxClient launcher."
          }

          Write-Host "Downloaded $((Get-Item $out).Length) bytes"

      - name: Extract Leapal FlaxClient jar
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "Leapal-FlaxClientLauncher.exe"
          $jar = Join-Path $env:RUNNER_TEMP "FlaxClient-Release.jar"
          python tools/scripts/extract_embedded_flax_jar.py $source $jar
          if (-not (Test-Path $jar)) {
            throw "FlaxClient JAR extraction did not produce an output file."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: beta/FlaxClientLauncher

      - name: Build beta 1.1 launcher with Leapal payload
        shell: pwsh
        working-directory: beta/FlaxClientLauncher
        run: |
          $env:FLAX_EMBED_JAR = Join-Path $env:RUNNER_TEMP "FlaxClient-Release.jar"
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "beta/FlaxClientLauncher/target/x86_64-pc-windows-msvc/release/flax-client-launcher.exe" "dist/FlaxClientLauncher-beta-1.1-leapal-windows-x86_64.exe"
          Get-FileHash "dist/FlaxClientLauncher-beta-1.1-leapal-windows-x86_64.exe" -Algorithm SHA256

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClientLauncher-beta-1.1-leapal-windows-x86_64
          path: dist/FlaxClientLauncher-beta-1.1-leapal-windows-x86_64.exe
          if-no-files-found: error
