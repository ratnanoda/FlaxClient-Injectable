name: Build beta 1.1 with Leapal-era FlaxClient

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-launcher:
    name: Build Leapal-era beta 1.1 launcher (Windows x86_64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Leapal-era client source
        uses: actions/checkout@v4
        with:
          ref: 43f734ca147179d7e440f4b30ca4bc40a033900c
          path: leapal-client

      - name: Checkout beta 1.1 launcher source
        uses: actions/checkout@v4
        with:
          ref: flaxclient-beta-1.1
          path: beta

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Build Leapal-era FlaxClient jar
        shell: pwsh
        working-directory: leapal-client
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          .\gradlew.bat build
          $jar = Resolve-Path "build/libs/FlaxClient-Release.jar"
          Write-Host "Leapal-era JAR: $jar"
          Get-FileHash $jar -Algorithm SHA256

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: beta/FlaxClientLauncher

      - name: Build beta 1.1 launcher with Leapal-era payload
        shell: pwsh
        working-directory: beta/FlaxClientLauncher
        run: |
          $env:FLAX_EMBED_JAR = Resolve-Path "../../leapal-client/build/libs/FlaxClient-Release.jar"
          Write-Host "Embedding $env:FLAX_EMBED_JAR"
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "beta/FlaxClientLauncher/target/x86_64-pc-windows-msvc/release/flax-client-launcher.exe" "dist/FlaxClientLauncher-beta-1.1-leapal-windows-x86_64.exe"
          Get-FileHash "dist/FlaxClientLauncher-beta-1.1-leapal-windows-x86_64.exe" -Algorithm SHA256

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClientLauncher-beta-1.1-leapal-windows-x86_64
          path: dist/FlaxClientLauncher-beta-1.1-leapal-windows-x86_64.exe
          if-no-files-found: error
