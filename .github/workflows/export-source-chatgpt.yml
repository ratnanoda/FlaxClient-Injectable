name: Apply YouTube Music integration

on:
  push:
    branches:
      - chatgpt/unify-youtube-music-20260803
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/unify-youtube-music-20260803
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          payload = ""
          pathlib.Path('/tmp/unify.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/unify.patch
          git apply /tmp/unify.patch
          rm -f .github/workflows/export-source-chatgpt.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify YouTube and Music playback"
          git push origin HEAD:chatgpt/unify-youtube-music-20260803
