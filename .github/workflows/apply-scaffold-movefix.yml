name: Apply Scaffold MoveFix Patch

on:
  push:
    branches:
      - agent/clean-injector-build
    paths:
      - .github/workflows/apply-scaffold-movefix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-injector-build
          fetch-depth: 0

      - name: Integrate Blatant panel and silent Scaffold MoveFix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError("Pattern not found in %s:\n%s" % (path, old))
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          ghost = "src/main/java/me/eldodebug/soar/gui/modmenu/category/impl/GhostCategory.java"
          replace_once(ghost,
              " * Main module workspace. Ghost uses the native ModuleCategory panel while\n * Other is an independent draggable and resizable module list.",
              " * Main module workspace. Ghost uses the native ModuleCategory panel while\n * Blatant and Other are independent draggable and resizable module lists.")
          replace_once(ghost,
              "    private final AuxiliaryPanel otherPanel;\n",
              "    private final AuxiliaryPanel blatantPanel;\n    private final AuxiliaryPanel otherPanel;\n")
          replace_once(ghost,
              "        otherPanel = new AuxiliaryPanel(\"Other\", ModCategory.OTHER);\n",
              "        blatantPanel = new AuxiliaryPanel(\"Blatant\", ModCategory.BLATANT);\n        otherPanel = new AuxiliaryPanel(\"Other\", ModCategory.OTHER);\n")
          replace_once(ghost,
              "    private void resetOtherPanel() {\n        otherPanel.reset();\n",
              "    private void resetOtherPanel() {\n        blatantPanel.reset();\n        otherPanel.reset();\n")
          replace_once(ghost,
              "        super.drawScreen(mouseX, mouseY, partialTicks);\n        drawPanel(otherPanel, mouseX, mouseY);\n",
              "        super.drawScreen(mouseX, mouseY, partialTicks);\n        drawPanel(blatantPanel, mouseX, mouseY);\n        drawPanel(otherPanel, mouseX, mouseY);\n")
          replace_once(ghost,
              "        float ghostPanelX = getX() + (getWidth() - DEFAULT_PANEL_WIDTH) / 2.0F;\n        panel.offsetX = ghostPanelX + DEFAULT_PANEL_WIDTH + PANEL_GAP - getX();\n",
              "        float ghostPanelX = getX() + (getWidth() - DEFAULT_PANEL_WIDTH) / 2.0F;\n        if(panel.category == ModCategory.BLATANT) {\n            panel.offsetX = ghostPanelX - DEFAULT_PANEL_WIDTH - PANEL_GAP - getX();\n        } else {\n            panel.offsetX = ghostPanelX + DEFAULT_PANEL_WIDTH + PANEL_GAP - getX();\n        }\n")
          replace_once(ghost,
              "        if(handlePanelClick(otherPanel, mouseX, mouseY, mouseButton)) {\n            return;\n        }\n        super.mouseClicked(mouseX, mouseY, mouseButton);\n",
              "        if(handlePanelClick(otherPanel, mouseX, mouseY, mouseButton)) {\n            return;\n        }\n        if(handlePanelClick(blatantPanel, mouseX, mouseY, mouseButton)) {\n            return;\n        }\n        super.mouseClicked(mouseX, mouseY, mouseButton);\n")
          replace_once(ghost,
              "        boolean handled = releasePanel(otherPanel, mouseButton);\n        if(!handled) {\n            super.mouseReleased(mouseX, mouseY, mouseButton);\n        }\n",
              "        boolean handledOther = releasePanel(otherPanel, mouseButton);\n        boolean handledBlatant = releasePanel(blatantPanel, mouseButton);\n        if(!handledOther && !handledBlatant) {\n            super.mouseReleased(mouseX, mouseY, mouseButton);\n        }\n")

          scaffold_path = Path("src/main/java/me/eldodebug/soar/management/mods/impl/ScaffoldMod.java")
          scaffold_path.write_text(r'''package me.eldodebug.soar.management.mods.impl;

import me.eldodebug.soar.management.event.EventTarget;
import me.eldodebug.soar.management.event.impl.EventUpdate;
import me.eldodebug.soar.management.language.TranslateText;
import me.eldodebug.soar.management.mods.Mod;
import me.eldodebug.soar.management.mods.ModCategory;
import net.minecraft.block.Block;
import net.minecraft.block.material.Material;
import net.minecraft.init.Blocks;
import net.minecraft.item.ItemBlock;
import net.minecraft.item.ItemStack;
import net.minecraft.network.play.client.C03PacketPlayer;
import net.minecraft.util.BlockPos;
import net.minecraft.util.EnumFacing;
import net.minecraft.util.MathHelper;
import net.minecraft.util.Vec3;

/**
 * Places a solid hotbar block below the player's feet while keeping the
 * visible camera independent from the rotation sent to the server.
 */
public class ScaffoldMod extends Mod {

    private static final EnumFacing[] SUPPORT_DIRECTIONS = {
            EnumFacing.DOWN,
            EnumFacing.NORTH,
            EnumFacing.SOUTH,
            EnumFacing.WEST,
            EnumFacing.EAST
    };
    private static final float INPUT_EPSILON = 0.0001F;

    private static boolean silentRotationActive;
    private static float cameraYaw;
    private static float silentYaw;
    private static float silentPitch;

    private int originalSlot = -1;
    private int placeCooldown;

    public ScaffoldMod() {
        super(TranslateText.SCAFFOLD, TranslateText.SCAFFOLD_DESCRIPTION, ModCategory.BLATANT);
    }

    @Override
    public void onEnable() {
        super.onEnable();
        originalSlot = mc.thePlayer == null ? -1 : mc.thePlayer.inventory.currentItem;
        placeCooldown = 0;
        clearSilentRotation();
    }

    @Override
    public void onDisable() {
        clearSilentRotation();
        restoreOriginalSlot();
        placeCooldown = 0;
        super.onDisable();
    }

    @EventTarget
    public void onUpdate(EventUpdate event) {
        clearSilentRotation();
        if(!canRun()) {
            return;
        }

        BlockPos target = getTargetPosition();
        if(!isReplaceable(target)) {
            return;
        }

        Placement placement = findPlacement(target);
        int slot = findBlockSlot();
        if(placement == null || slot < 0) {
            return;
        }

        lockSilentRotation(placement.hitVec);

        if(placeCooldown > 0) {
            placeCooldown--;
            return;
        }

        selectSlot(slot);
        ItemStack stack = mc.thePlayer.inventory.getStackInSlot(slot);
        if(!isUsableBlock(stack)) {
            clearSilentRotation();
            return;
        }

        mc.thePlayer.sendQueue.addToSendQueue(
                new C03PacketPlayer.C05PacketPlayerLook(silentYaw, silentPitch, mc.thePlayer.onGround));

        boolean placed = mc.playerController.onPlayerRightClick(
                mc.thePlayer,
                mc.theWorld,
                stack,
                placement.support,
                placement.face,
                placement.hitVec);

        if(placed) {
            mc.thePlayer.swingItem();
            placeCooldown = 1;
        }
    }

    private boolean canRun() {
        if(mc.thePlayer == null || mc.theWorld == null || mc.playerController == null) {
            return false;
        }
        if(mc.currentScreen != null || !mc.inGameHasFocus) {
            return false;
        }
        if(mc.thePlayer.isSpectator() || mc.thePlayer.capabilities.isFlying || mc.thePlayer.ridingEntity != null) {
            return false;
        }
        return !mc.thePlayer.isInWater() && !mc.thePlayer.isInLava() && !mc.thePlayer.isOnLadder();
    }

    private BlockPos getTargetPosition() {
        return new BlockPos(
                mc.thePlayer.posX,
                mc.thePlayer.getEntityBoundingBox().minY - 1.0D,
                mc.thePlayer.posZ);
    }

    private Placement findPlacement(BlockPos target) {
        for(EnumFacing direction : SUPPORT_DIRECTIONS) {
            BlockPos support = target.offset(direction);
            if(!isValidSupport(support)) {
                continue;
            }

            EnumFacing face = direction.getOpposite();
            Vec3 hitVec = new Vec3(
                    support.getX() + 0.5D + face.getFrontOffsetX() * 0.5D,
                    support.getY() + 0.5D + face.getFrontOffsetY() * 0.5D,
                    support.getZ() + 0.5D + face.getFrontOffsetZ() * 0.5D);
            return new Placement(support, face, hitVec);
        }
        return null;
    }

    private boolean isValidSupport(BlockPos pos) {
        Block block = mc.theWorld.getBlockState(pos).getBlock();
        Material material = block.getMaterial();
        return block != Blocks.air && material != null && material.isSolid() && !material.isReplaceable();
    }

    private boolean isReplaceable(BlockPos pos) {
        Block block = mc.theWorld.getBlockState(pos).getBlock();
        Material material = block.getMaterial();
        return block == Blocks.air || (material != null && material.isReplaceable());
    }

    private int findBlockSlot() {
        int currentSlot = mc.thePlayer.inventory.currentItem;
        ItemStack currentStack = mc.thePlayer.inventory.getStackInSlot(currentSlot);
        if(isUsableBlock(currentStack)) {
            return currentSlot;
        }

        int bestSlot = -1;
        int bestCount = 0;
        for(int slot = 0; slot < 9; slot++) {
            ItemStack stack = mc.thePlayer.inventory.getStackInSlot(slot);
            if(isUsableBlock(stack) && stack.stackSize > bestCount) {
                bestSlot = slot;
                bestCount = stack.stackSize;
            }
        }
        return bestSlot;
    }

    private boolean isUsableBlock(ItemStack stack) {
        if(stack == null || stack.stackSize <= 0 || !(stack.getItem() instanceof ItemBlock)) {
            return false;
        }

        Block block = ((ItemBlock) stack.getItem()).getBlock();
        if(block == null || block == Blocks.air) {
            return false;
        }

        Material material = block.getMaterial();
        return material != null && material.isSolid() && block.isFullCube();
    }

    private void selectSlot(int slot) {
        if(mc.thePlayer.inventory.currentItem == slot) {
            return;
        }
        mc.thePlayer.inventory.currentItem = slot;
        mc.playerController.updateController();
    }

    private void restoreOriginalSlot() {
        if(mc.thePlayer == null || mc.playerController == null || originalSlot < 0 || originalSlot > 8) {
            originalSlot = -1;
            return;
        }
        selectSlot(originalSlot);
        originalSlot = -1;
    }

    private void lockSilentRotation(Vec3 hitVec) {
        cameraYaw = mc.thePlayer.rotationYaw;
        float[] rotations = rotationsTo(hitVec);
        silentYaw = cameraYaw + MathHelper.wrapAngleTo180_float(rotations[0] - cameraYaw);
        silentPitch = rotations[1];
        silentRotationActive = true;
    }

    private float[] rotationsTo(Vec3 hitVec) {
        double deltaX = hitVec.xCoord - mc.thePlayer.posX;
        double deltaY = hitVec.yCoord - (mc.thePlayer.posY + mc.thePlayer.getEyeHeight());
        double deltaZ = hitVec.zCoord - mc.thePlayer.posZ;
        double horizontal = Math.sqrt(deltaX * deltaX + deltaZ * deltaZ);

        float yaw = (float) (Math.toDegrees(Math.atan2(deltaZ, deltaX)) - 90.0D);
        float pitch = (float) -Math.toDegrees(Math.atan2(deltaY, horizontal));
        pitch = Math.max(-90.0F, Math.min(90.0F, pitch));
        return new float[] { yaw, pitch };
    }

    private static void clearSilentRotation() {
        silentRotationActive = false;
    }

    public static boolean isSilentRotationActive() {
        return silentRotationActive;
    }

    public static boolean shouldApplyMoveFix() {
        return silentRotationActive && SettingsMod.isMoveFixEnabled();
    }

    public static float getSilentYaw() {
        return silentYaw;
    }

    public static float getSilentPitch() {
        return silentPitch;
    }

    /**
     * Converts camera-relative intent to one of vanilla's eight digital
     * forward/strafe combinations under the silent server rotation.
     * The returned array is {strafe, forward}.
     */
    public static float[] getMoveFixedInput(float strafe, float forward) {
        float magnitude = Math.max(Math.abs(strafe), Math.abs(forward));
        if(magnitude < INPUT_EPSILON) {
            return new float[] { 0.0F, 0.0F };
        }

        float inputStrafe = sign(strafe);
        float inputForward = sign(forward);
        double[] desired = movementVector(cameraYaw, inputStrafe, inputForward);

        int bestStrafe = 0;
        int bestForward = 0;
        double bestDot = -Double.MAX_VALUE;

        for(int candidateForward = -1; candidateForward <= 1; candidateForward++) {
            for(int candidateStrafe = -1; candidateStrafe <= 1; candidateStrafe++) {
                if(candidateForward == 0 && candidateStrafe == 0) {
                    continue;
                }

                double[] candidate = movementVector(silentYaw, candidateStrafe, candidateForward);
                double dot = desired[0] * candidate[0] + desired[1] * candidate[1];
                if(dot > bestDot) {
                    bestDot = dot;
                    bestStrafe = candidateStrafe;
                    bestForward = candidateForward;
                }
            }
        }

        return new float[] { bestStrafe * magnitude, bestForward * magnitude };
    }

    private static float sign(float value) {
        if(value > INPUT_EPSILON) {
            return 1.0F;
        }
        if(value < -INPUT_EPSILON) {
            return -1.0F;
        }
        return 0.0F;
    }

    private static double[] movementVector(float yaw, float strafe, float forward) {
        double radians = Math.toRadians(yaw);
        double x = strafe * Math.cos(radians) - forward * Math.sin(radians);
        double z = forward * Math.cos(radians) + strafe * Math.sin(radians);
        double length = Math.sqrt(x * x + z * z);
        if(length < INPUT_EPSILON) {
            return new double[] { 0.0D, 0.0D };
        }
        return new double[] { x / length, z / length };
    }

    private static final class Placement {
        private final BlockPos support;
        private final EnumFacing face;
        private final Vec3 hitVec;

        private Placement(BlockPos support, EnumFacing face, Vec3 hitVec) {
            this.support = support;
            this.face = face;
            this.hitVec = hitVec;
        }
    }
}
''', encoding="utf-8")

          player_mixin = Path("src/main/java/me/eldodebug/soar/injection/mixin/mixins/entity/MixinEntityPlayerSP.java")
          player_mixin.write_text(r'''package me.eldodebug.soar.injection.mixin.mixins.entity;

import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Unique;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

import me.eldodebug.soar.management.event.impl.EventMotionUpdate;
import me.eldodebug.soar.management.event.impl.EventSendChat;
import me.eldodebug.soar.management.event.impl.EventUpdate;
import me.eldodebug.soar.management.mods.impl.ScaffoldMod;
import net.minecraft.client.entity.EntityPlayerSP;

@Mixin(EntityPlayerSP.class)
public class MixinEntityPlayerSP {

    private final EventUpdate glide$eventUpdate = new EventUpdate();
    private final EventMotionUpdate glide$eventMotionUpdate = new EventMotionUpdate();

    @Unique
    private boolean glide$scaffoldRotationSpoofed;
    @Unique
    private float glide$cameraYaw;
    @Unique
    private float glide$cameraPitch;

    @Inject(method = "onUpdate", at = @At("HEAD"))
    public void preOnUpdate(CallbackInfo ci) {
        glide$eventUpdate.call();
    }

    @Inject(method = "sendChatMessage", at = @At("HEAD"), cancellable = true)
    public void preSendChatMessage(String message, CallbackInfo ci) {
        EventSendChat event = new EventSendChat(message);
        event.call();

        if(event.isCancelled()) {
            ci.cancel();
        }
    }

    @Inject(method = "onUpdateWalkingPlayer", at = @At("HEAD"))
    private void preOnUpdateWalkingPlayer(CallbackInfo ci) {
        glide$eventMotionUpdate.call();
        glide$scaffoldRotationSpoofed = false;

        if(ScaffoldMod.isSilentRotationActive()) {
            EntityPlayerSP player = (EntityPlayerSP) (Object) this;
            glide$cameraYaw = player.rotationYaw;
            glide$cameraPitch = player.rotationPitch;
            player.rotationYaw = ScaffoldMod.getSilentYaw();
            player.rotationPitch = ScaffoldMod.getSilentPitch();
            glide$scaffoldRotationSpoofed = true;
        }
    }

    @Inject(method = "onUpdateWalkingPlayer", at = @At("RETURN"))
    private void postOnUpdateWalkingPlayer(CallbackInfo ci) {
        if(!glide$scaffoldRotationSpoofed) {
            return;
        }

        EntityPlayerSP player = (EntityPlayerSP) (Object) this;
        player.rotationYaw = glide$cameraYaw;
        player.rotationPitch = glide$cameraPitch;
        glide$scaffoldRotationSpoofed = false;
    }
}
''', encoding="utf-8")

          living = "src/main/java/me/eldodebug/soar/injection/mixin/mixins/entity/MixinEntityLivingBase.java"
          replace_once(living,
              "import org.spongepowered.asm.mixin.injection.Inject;\n",
              "import org.spongepowered.asm.mixin.injection.Inject;\nimport org.spongepowered.asm.mixin.injection.Redirect;\n")
          replace_once(living,
              "import me.eldodebug.soar.management.mods.impl.SlowSwingMod;\n",
              "import me.eldodebug.soar.management.mods.impl.ScaffoldMod;\nimport me.eldodebug.soar.management.mods.impl.SlowSwingMod;\n")
          replace_once(living,
              "    @Inject(method = \"getLook\", at = @At(\"HEAD\"), cancellable = true)\n",
              "    @Redirect(method = \"onLivingUpdate\", at = @At(value = \"INVOKE\",\n            target = \"Lnet/minecraft/entity/EntityLivingBase;moveEntityWithHeading(FF)V\"))\n    private void glide$applyScaffoldMoveFix(EntityLivingBase entity, float strafe, float forward) {\n        if(entity instanceof EntityPlayerSP && ScaffoldMod.shouldApplyMoveFix()) {\n            float[] fixedInput = ScaffoldMod.getMoveFixedInput(strafe, forward);\n            float cameraRotationYaw = entity.rotationYaw;\n            entity.rotationYaw = ScaffoldMod.getSilentYaw();\n            try {\n                entity.moveEntityWithHeading(fixedInput[0], fixedInput[1]);\n            } finally {\n                entity.rotationYaw = cameraRotationYaw;\n            }\n            return;\n        }\n\n        entity.moveEntityWithHeading(strafe, forward);\n    }\n\n    @Inject(method = \"getLook\", at = @At(\"HEAD\"), cancellable = true)\n")

          obsolete = Path("src/main/java/me/eldodebug/soar/gui/modmenu/category/impl/BlatantCategory.java")
          if obsolete.exists():
              obsolete.unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No source changes were necessary"
            exit 0
          fi
          git commit -m "Integrate Blatant panel and add strict Scaffold MoveFix"
          git push origin HEAD:agent/clean-injector-build
