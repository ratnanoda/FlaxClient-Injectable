name: Apply Scaffold MoveFix Patch

on:
  push:
    branches:
      - agent/clean-injector-build
    paths:
      - .github/workflows/apply-scaffold-movefix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-injector-build
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/scripts/apply_scaffold_movefix.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No source changes were necessary"
            exit 0
          fi
          git commit -m "Integrate Blatant panel and add strict Scaffold MoveFix"
          git push origin HEAD:agent/clean-injector-build
