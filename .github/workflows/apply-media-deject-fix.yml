name: Repair YouTube manager syntax

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair generated Java syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/me/eldodebug/soar/management/youtube/YouTubeManager.java')
          text = path.read_text()
          text = text.replace(
              '        thread.start();\n    }\n    }\n\n    public void addUrl',
              '        thread.start();\n    }\n\n    public void addUrl',
              1)
          text = text.replace(
              "outputLog.append(line).append('\n');",
              "outputLog.append(line).append('\\n');")
          text = text.replace(
              'GlideLogger.warn(lastFailure + "\n" + outputLog.toString());',
              'GlideLogger.warn(lastFailure + "\\n" + outputLog.toString());')
          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/me/eldodebug/soar/management/youtube/YouTubeManager.java
          git commit -m "Repair YouTube manager syntax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
