name: Apply media and reinjection fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply requested changes
        shell: bash
        run: |
          cat .github/patches/media-deject-fix.b64.part* | base64 -d | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/patches/media-deject-fix.b64.part*
          rm -f .github/workflows/apply-media-deject-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix media playback and re-injection lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
