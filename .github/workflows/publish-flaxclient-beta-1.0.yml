name: Publish FlaxClient Beta 1.0

# Publishes the verified Windows x64 single-EXE artifact.
on:
  push:
    branches:
      - chatgpt/beginner-guide-single-exe-20260803
    paths:
      - .github/workflows/publish-flaxclient-beta-1.0.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/publish-flaxclient-beta-1.0.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: flaxclient-beta-1.0
      RELEASE_NAME: FlaxClient Beta 1.0
      RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
      ARTIFACT_RUN_ID: '30828655071'
      ARTIFACT_NAME: FlaxClient-Lunar-Single-EXE-Windows-x64
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}

      - name: Mark earlier releases as old
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name, (.name // .tag_name)] | @tsv' |
          while IFS=$'\t' read -r release_id tag_name release_name; do
            [ -n "${release_id:-}" ] || continue
            [ "$tag_name" = "$RELEASE_TAG" ] && continue
            case "$release_name" in
              "[Old]"*) continue ;;
            esac
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="[Old] ${release_name}" >/dev/null
            echo "Renamed release ${tag_name}: [Old] ${release_name}"
          done

      - name: Download verified single-EXE artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact
          exe_path="$(find release-artifact -type f -iname '*.exe' -print -quit)"
          if [ -z "$exe_path" ]; then
            echo "No EXE was found in the workflow artifact." >&2
            exit 1
          fi
          cp "$exe_path" FlaxClient-Beta-1.0.exe
          sha256sum FlaxClient-Beta-1.0.exe | tee FlaxClient-Beta-1.0.sha256

      - name: Prepare asset-complete Beta draft
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # FlaxClient Beta 1.0

          Windows x64 single-file beta release for Lunar Client 1.8.9.

          ## Highlights
          - Flappy Steve with smoother controls and Minecraft-style visuals
          - Tetris with enhanced effects, plus Snake
          - Improved BedESP defense-block panels and smoother tracking
          - Resizable Ghost module list and updated beginner guide
          - Unified YouTube/Music playback with PiP capped at 60 FPS

          This is a beta build. Visual and gameplay behavior may still receive further adjustments.
          EOF

          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id" | head -n 1)"

          if [ -n "$release_id" ]; then
            release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            is_draft="$(jq -r '.draft' <<<"$release_state")"
            asset_count="$(jq -r '.assets | length' <<<"$release_state")"
            if [ "$is_draft" != "true" ] && [ "$asset_count" -lt 2 ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
              release_id=""
            fi
          fi

          if [ -z "$release_id" ]; then
            jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg target "$RELEASE_TARGET" \
              --arg name "$RELEASE_NAME" \
              --rawfile body release-notes.md \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:true}' \
              > create-release.json
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              --input create-release.json --jq '.id')"
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          upload_url="$(jq -r '.upload_url' <<<"$release_json" | sed 's/{?name,label}$//')"

          upload_asset() {
            local file="$1"
            local mime="$2"
            local name asset_id
            name="$(basename "$file")"
            asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --jq ".[] | select(.name == \"${name}\") | .id" | head -n 1)"
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: ${mime}" \
              --data-binary "@${file}" \
              "${upload_url}?name=${name}" \
              | jq -e --arg expected "$name" '.name == $expected' >/dev/null
          }

          upload_asset FlaxClient-Beta-1.0.exe application/octet-stream
          upload_asset FlaxClient-Beta-1.0.sha256 text/plain

          asset_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets | length')"
          if [ "$asset_count" -ne 2 ]; then
            echo "Expected 2 release assets, found ${asset_count}." >&2
            exit 1
          fi

          echo "RELEASE_ID=${release_id}" >> "$GITHUB_ENV"

      - name: Publish Beta 1.0
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg name "$RELEASE_NAME" \
            --rawfile body release-notes.md \
            '{name:$name,body:$body,draft:false,prerelease:true}' \
            > publish-release.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input publish-release.json >/dev/null

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          jq '{name, tag_name, prerelease, draft, html_url, assets: [.assets[].name]}' <<<"$release"
          jq -e '
            .name == "FlaxClient Beta 1.0" and
            .draft == false and
            .prerelease == true and
            ([.assets[].name] | sort) == (["FlaxClient-Beta-1.0.exe", "FlaxClient-Beta-1.0.sha256"] | sort)
          ' <<<"$release" >/dev/null
