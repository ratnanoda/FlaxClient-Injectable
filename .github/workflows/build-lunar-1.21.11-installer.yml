name: Build Lunar 1.21.11 Safe Installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/lunar-1.21.11-bootstrap
    paths:
      - "lunar-1.21.11/**"
      - "installer/lunar-1.21.11/**"
      - ".github/workflows/build-lunar-1.21.11-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build Lunar 1.21.11 Fabric JAR
        shell: pwsh
        run: |
          gradle -p lunar-1.21.11 clean build --stacktrace
          $jar = Get-ChildItem "lunar-1.21.11/build/libs/FlaxClient-Lunar-1.21.11-*.jar" |
            Where-Object { $_.Name -notmatch "sources|dev|javadoc" } |
            Select-Object -First 1
          if (-not $jar) { throw "Remapped Fabric JAR was not produced" }
          New-Item -ItemType Directory -Force -Path "installer/lunar-1.21.11/payload" | Out-Null
          Copy-Item $jar.FullName "installer/lunar-1.21.11/payload/FlaxClient-Lunar-1.21.11.jar"

      - name: Configure x64 installer
        shell: pwsh
        run: cmake -S installer/lunar-1.21.11 -B build/lunar-installer -G "Visual Studio 17 2022" -A x64

      - name: Build x64 installer
        shell: pwsh
        run: cmake --build build/lunar-installer --config Release --parallel

      - name: Verify embedded JAR and stage one EXE
        shell: pwsh
        run: |
          $exe = "build/lunar-installer/Release/FlaxClient-Lunar-1.21.11-Installer.exe"
          if (-not (Test-Path $exe)) { throw "Installer EXE was not produced" }
          $jarSize = (Get-Item "installer/lunar-1.21.11/payload/FlaxClient-Lunar-1.21.11.jar").Length
          $exeSize = (Get-Item $exe).Length
          if ($exeSize -le $jarSize) { throw "EXE does not appear to contain the embedded JAR" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe "dist/FlaxClient-Lunar-1.21.11-Installer.exe"
          $files = Get-ChildItem dist -File
          if ($files.Count -ne 1) { throw "Expected exactly one distributable file" }
          Get-FileHash "dist/FlaxClient-Lunar-1.21.11-Installer.exe" -Algorithm SHA256

      - name: Upload single-EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-Lunar-1.21.11-Safe-Installer-Windows-x64
          path: dist/FlaxClient-Lunar-1.21.11-Installer.exe
          if-no-files-found: error
          retention-days: 14
