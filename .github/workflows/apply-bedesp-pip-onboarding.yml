name: Apply BedESP PiP and onboarding update

on:
  push:
    branches:
      - chatgpt/beginner-guide-single-exe-20260803
    paths:
      - .github/workflows/apply-bedesp-pip-onboarding.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/beginner-guide-single-exe-20260803
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          payload = ""
          target = pathlib.Path('.github/apply_runtime.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          namespace = {'__name__': '__main__', '__file__': str(target.resolve())}
          exec(compile(target.read_text(encoding='utf-8'), str(target), 'exec'), namespace)
          target.unlink()
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/me/eldodebug/soar/management/mods/impl/BedESPMod.java \
                  src/main/java/me/eldodebug/soar/management/youtube/YouTubeManager.java \
                  src/main/java/me/eldodebug/soar/gui/modmenu/category/impl/ModuleCategory.java \
                  src/main/java/me/eldodebug/soar/gui/modmenu/GuiModMenu.java
          git commit -m "Redesign BedESP and add Ghost resize onboarding"
          git push origin HEAD:chatgpt/beginner-guide-single-exe-20260803
