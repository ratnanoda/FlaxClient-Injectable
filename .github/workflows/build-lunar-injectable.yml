name: Build Generic Minecraft 1.8.9 Single-EXE Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Build Minecraft 1.8.9 MCP, SRG, and Notch runtime jars
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" lunarJar reobfDawnJar reobfJar --no-daemon --stacktrace
          if (!(Test-Path "build\libs\FlaxClient-Lunar.jar")) {
            throw "MCP runtime jar was not generated"
          }
          if (!(Test-Path "build\libs\FlaxClient-Dawn.jar")) {
            throw "SRG runtime jar was not generated"
          }
          if (!(Test-Path "build\libs\FlaxClient-Release.jar")) {
            throw "Notch runtime jar was not generated"
          }

      - name: Verify MCP, SRG, and Notch mappings
        shell: powershell
        run: |
          $mcp = "build\libs\FlaxClient-Lunar.jar"
          $srg = "build\libs\FlaxClient-Dawn.jar"
          $notch = "build\libs\FlaxClient-Release.jar"

          $mcpBootstrap = & javap -classpath $mcp -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $mcpHooks = & javap -classpath $mcp -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if ($mcpBootstrap -notmatch "net/minecraft/client/Minecraft") {
            throw "MCP payload does not contain readable Minecraft class names"
          }
          if ($mcpBootstrap -notmatch "getMinecraft") {
            throw "MCP payload does not retain readable Minecraft member names"
          }
          if ($mcpHooks -notmatch "net/minecraft/client/gui/GuiIngame") {
            throw "MCP LateHooks does not contain readable Minecraft class names"
          }

          $srgBootstrap = & javap -classpath $srg -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $srgHooks = & javap -classpath $srg -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if ($srgBootstrap -notmatch "net/minecraft/client/Minecraft") {
            throw "SRG payload lost the readable Minecraft class names expected by the runtime"
          }
          if (($srgBootstrap -notmatch "func_71410_x") -and
              ($srgHooks -notmatch "field_71439_g") -and
              ($srgHooks -notmatch "func_")) {
            throw "SRG payload does not appear to contain SRG-reobfuscated Minecraft members"
          }

          $notchBootstrap = & javap -classpath $notch -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $notchHooks = & javap -classpath $notch -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if (($notchBootstrap -notmatch "ave") -and ($notchHooks -notmatch "avo")) {
            throw "Notch payload does not appear to contain Minecraft 1.8.9 obfuscated class names"
          }

          $mcpEntries = & jar tf $mcp
          if ($mcpEntries -notcontains "assets/minecraft/soar/tools/windows-x64/yt-dlp.exe") {
            throw "Bundled yt-dlp resource is missing"
          }
          if ($mcpEntries -notcontains "assets/minecraft/soar/tools/windows-x64/ffmpeg.zip") {
            throw "Bundled ffmpeg resource is missing"
          }

          $srgEntries = & jar tf $srg
          if ($srgEntries -notcontains "me/eldodebug/soar/attach/CompatibleLateClassTransformer.class") {
            throw "SRG compatibility transformer bridge is missing"
          }
          if ($srgEntries -notcontains "me/eldodebug/soar/attach/SrgMappingAdapter.class") {
            throw "SRG mapping adapter is missing"
          }
          if ($srgEntries -notcontains "flax/mappings/mcp-srg.srg") {
            throw "MCP-to-SRG mapping resource is missing"
          }

      - name: Configure generic 1.8.9 single-EXE build
        shell: powershell
        run: |
          $mcp = (Resolve-Path "build\libs\FlaxClient-Lunar.jar").Path.Replace('\', '/')
          $srg = (Resolve-Path "build\libs\FlaxClient-Dawn.jar").Path.Replace('\', '/')
          $notch = (Resolve-Path "build\libs\FlaxClient-Release.jar").Path.Replace('\', '/')
          cmake -S attach -B attach/build-universal -A x64 `
            "-DFLAX_CLIENT_MCP_JAR=$mcp" `
            "-DFLAX_CLIENT_SRG_JAR=$srg" `
            "-DFLAX_CLIENT_NOTCH_JAR=$notch"

      - name: Build embedded DLL and single EXE
        shell: powershell
        run: cmake --build attach/build-universal --config Release --target FlaxInjector

      - name: Verify embedded runtime and metadata
        shell: powershell
        run: |
          $exe = "attach\build-universal\bin\Release\FlaxClient.exe"
          $dll = "attach\build-universal\bin\Release\FlaxClient.dll"
          if (!(Test-Path $exe)) { throw "FlaxClient.exe was not generated" }
          if (!(Test-Path $dll)) { throw "Intermediate FlaxClient.dll was not generated" }

          $verification = Start-Process -FilePath $exe -ArgumentList "--verify-embedded" -Wait -PassThru
          if ($verification.ExitCode -ne 0) {
            throw "The EXE could not verify or extract its embedded DLL"
          }
          if ((Get-Item $exe).Length -le (Get-Item $dll).Length) {
            throw "The final EXE does not appear to contain the DLL resource"
          }

          $version = (Get-Item $exe).VersionInfo
          if ($version.FileDescription -ne "FlaxClient Minecraft 1.8.9 Attach Tool") {
            throw "Expected Minecraft 1.8.9 Windows version metadata is missing"
          }
          Write-Host "File description: $($version.FileDescription)"
          Write-Host "Product version: $($version.ProductVersion)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Stage one-file distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build\single-exe" | Out-Null
          Copy-Item "attach\build-universal\bin\Release\FlaxClient.exe" "build\single-exe\FlaxClient.exe"
          $files = @(Get-ChildItem "build\single-exe" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "FlaxClient.exe") {
            throw "Distribution must contain exactly one FlaxClient.exe"
          }

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-1.8.9-Single-EXE-Windows-x64
          path: build/single-exe/FlaxClient.exe
          if-no-files-found: error
          retention-days: 7
