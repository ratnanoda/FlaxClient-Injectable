name: Build Lunar + Dawn Single-EXE Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - chatgpt/unify-youtube-music-20260803
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Build Lunar and Dawn runtime jars
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" lunarJar reobfDawnJar --no-daemon --stacktrace
          if (!(Test-Path "build\libs\FlaxClient-Lunar.jar")) {
            throw "FlaxClient-Lunar.jar was not generated"
          }
          if (!(Test-Path "build\libs\FlaxClient-Dawn.jar")) {
            throw "FlaxClient-Dawn.jar was not generated"
          }

      - name: Verify Lunar MCP and Dawn SRG mappings
        shell: powershell
        run: |
          $lunar = "build\libs\FlaxClient-Lunar.jar"
          $dawn = "build\libs\FlaxClient-Dawn.jar"

          $lunarBootstrap = & javap -classpath $lunar -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $lunarHooks = & javap -classpath $lunar -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if ($lunarBootstrap -notmatch "net/minecraft/client/Minecraft") {
            throw "AttachBootstrap does not contain Lunar-compatible Minecraft class names"
          }
          if ($lunarBootstrap -notmatch "getMinecraft") {
            throw "Lunar jar does not retain MCP/readable Minecraft member names"
          }
          if ($lunarHooks -notmatch "net/minecraft/client/gui/GuiIngame") {
            throw "LateHooks does not contain Lunar-compatible Minecraft class names"
          }

          $dawnBootstrap = & javap -classpath $dawn -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $dawnHooks = & javap -classpath $dawn -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if ($dawnBootstrap -notmatch "net/minecraft/client/Minecraft") {
            throw "Dawn jar lost the readable Minecraft class names expected by the Feather-style runtime"
          }
          if (($dawnBootstrap -notmatch "func_71410_x") -and
              ($dawnHooks -notmatch "field_71439_g") -and
              ($dawnHooks -notmatch "func_")) {
            throw "Dawn jar does not appear to contain SRG-reobfuscated Minecraft members"
          }

          $entries = & jar tf $lunar
          if ($entries -notcontains "assets/minecraft/soar/tools/windows-x64/yt-dlp.exe") {
            throw "Bundled yt-dlp resource is missing"
          }
          if ($entries -notcontains "assets/minecraft/soar/tools/windows-x64/ffmpeg.zip") {
            throw "Bundled ffmpeg resource is missing"
          }
          if ($entries -notcontains "me/eldodebug/soar/gui/modmenu/BeginnerGuideOverlay.class") {
            throw "Beginner guide class is missing"
          }

      - name: Configure universal single-EXE build
        shell: powershell
        run: |
          $lunar = (Resolve-Path "build\libs\FlaxClient-Lunar.jar").Path.Replace('\', '/')
          $dawn = (Resolve-Path "build\libs\FlaxClient-Dawn.jar").Path.Replace('\', '/')
          cmake -S attach -B attach/build-universal -A x64 `
            "-DFLAX_CLIENT_LUNAR_JAR=$lunar" `
            "-DFLAX_CLIENT_DAWN_JAR=$dawn"

      - name: Build embedded DLL and single EXE
        shell: powershell
        run: cmake --build attach/build-universal --config Release --target FlaxInjector

      - name: Verify embedded runtime and metadata
        shell: powershell
        run: |
          $exe = "attach\build-universal\bin\Release\FlaxClient.exe"
          $dll = "attach\build-universal\bin\Release\FlaxClient.dll"
          if (!(Test-Path $exe)) { throw "FlaxClient.exe was not generated" }
          if (!(Test-Path $dll)) { throw "Intermediate FlaxClient.dll was not generated" }

          $verification = Start-Process -FilePath $exe -ArgumentList "--verify-embedded" -Wait -PassThru
          if ($verification.ExitCode -ne 0) {
            throw "The EXE could not verify or extract its embedded DLL"
          }
          if ((Get-Item $exe).Length -le (Get-Item $dll).Length) {
            throw "The final EXE does not appear to contain the DLL resource"
          }

          $runtime = @(Get-ChildItem "$env:LOCALAPPDATA\FlaxClient\runtime\FlaxClient-*.dll" -File -ErrorAction SilentlyContinue)
          if ($runtime.Count -lt 1) {
            throw "The embedded DLL was not materialized under LocalAppData"
          }

          $version = (Get-Item $exe).VersionInfo
          if ($version.FileDescription -ne "FlaxClient Lunar + Dawn 1.8.9 Attach Tool") {
            throw "Expected Windows version metadata is missing"
          }
          Write-Host "File description: $($version.FileDescription)"
          Write-Host "Product version: $($version.ProductVersion)"

          $signature = Get-AuthenticodeSignature $exe
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -eq "NotSigned") {
            Write-Warning "This community build is unsigned. Production releases should be Authenticode-signed."
          }

          Get-FileHash $exe -Algorithm SHA256

      - name: Scan final EXE with Microsoft Defender
        shell: powershell
        run: |
          $exe = (Resolve-Path "attach\build-universal\bin\Release\FlaxClient.exe").Path
          $defender = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $defender)) {
            Write-Warning "Microsoft Defender command-line scanner is unavailable on this runner."
            exit 0
          }

          & $defender -SignatureUpdate
          $scan = Start-Process -FilePath $defender `
              -ArgumentList @("-Scan", "-ScanType", "3", "-File", $exe, "-DisableRemediation") `
              -Wait -PassThru -NoNewWindow
          if ($scan.ExitCode -eq 2) {
            throw "Microsoft Defender detected the generated EXE"
          }
          if ($scan.ExitCode -ne 0) {
            Write-Warning "Microsoft Defender scan could not complete (exit code $($scan.ExitCode))."
          } else {
            Write-Host "Microsoft Defender scan completed without a detection."
          }

      - name: Stage one-file distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build\single-exe" | Out-Null
          Copy-Item "attach\build-universal\bin\Release\FlaxClient.exe" "build\single-exe\FlaxClient.exe"
          $files = @(Get-ChildItem "build\single-exe" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "FlaxClient.exe") {
            throw "Distribution must contain exactly one FlaxClient.exe"
          }

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-Lunar-Dawn-Single-EXE-Windows-x64
          path: build/single-exe/FlaxClient.exe
          if-no-files-found: error
          retention-days: 7
