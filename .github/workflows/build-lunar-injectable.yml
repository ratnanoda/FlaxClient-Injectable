name: Build Lunar Injectable Package

on:
  push:
    branches:
      - chatgpt/unify-youtube-music-20260803
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Build Lunar-compatible client jar
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" lunarJar --no-daemon --stacktrace
          if (!(Test-Path "build\libs\FlaxClient-Lunar.jar")) {
            throw "FlaxClient-Lunar.jar was not generated"
          }

      - name: Verify Lunar mappings and bundled media tools
        shell: powershell
        run: |
          $jar = "build\libs\FlaxClient-Lunar.jar"
          $bootstrap = & javap -classpath $jar -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $hooks = & javap -classpath $jar -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if ($bootstrap -notmatch "net/minecraft/client/Minecraft") {
            throw "AttachBootstrap does not contain Lunar-compatible Minecraft class names"
          }
          if ($hooks -notmatch "net/minecraft/client/gui/GuiIngame") {
            throw "LateHooks does not contain Lunar-compatible Minecraft class names"
          }
          $entries = & jar tf $jar
          if ($entries -notcontains "assets/minecraft/soar/tools/windows-x64/yt-dlp.exe") {
            throw "Bundled yt-dlp resource is missing"
          }
          if ($entries -notcontains "assets/minecraft/soar/tools/windows-x64/ffmpeg.zip") {
            throw "Bundled ffmpeg resource is missing"
          }

      - name: Configure Lunar DLL
        shell: powershell
        run: |
          $jar = (Resolve-Path "build\libs\FlaxClient-Lunar.jar").Path.Replace('\', '/')
          cmake -S attach -B attach/build-lunar -A x64 "-DFLAX_CLIENT_JAR=$jar"

      - name: Build Lunar DLL and injector
        shell: powershell
        run: cmake --build attach/build-lunar --config Release

      - name: Stage package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build\attach-lunar" | Out-Null
          Copy-Item "attach\build-lunar\bin\Release\FlaxClient.dll" "build\attach-lunar\FlaxClient.dll"
          Copy-Item "attach\build-lunar\bin\Release\FlaxInjector.exe" "build\attach-lunar\FlaxInjector.exe"
          @"
          FlaxClient Lunar Client OptiFine 1.8.9 Windows x64 package.

          Music is integrated into the YouTube page. Add a YouTube URL to download it,
          then switch playback between Video (PiP) and Music (bottom-right compact HUD).
          yt-dlp and ffmpeg are embedded in FlaxClient.dll and extracted automatically.

          Open Lunar Client 1.8.9 and wait for the main menu before running FlaxInjector.exe.
          "@ | Set-Content -Encoding UTF8 "build\attach-lunar\README.txt"
          if (!(Test-Path "build\attach-lunar\FlaxInjector.exe")) { throw "FlaxInjector.exe was not generated" }
          if (!(Test-Path "build\attach-lunar\FlaxClient.dll")) { throw "FlaxClient.dll was not generated" }
          Get-FileHash "build\attach-lunar\FlaxInjector.exe" -Algorithm SHA256
          Get-FileHash "build\attach-lunar\FlaxClient.dll" -Algorithm SHA256

      - name: Upload Lunar package
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-Lunar-YouTube-Music-Windows-x64
          path: build/attach-lunar/*
          if-no-files-found: error
          retention-days: 7
