name: Build Lunar Single-EXE Package

on:
  push:
    branches:
      - chatgpt/beginner-guide-single-exe-20260803
  pull_request:
    branches:
      - chatgpt/unify-youtube-music-20260803
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote_release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: flaxclient-beta-1.0-standard
      RELEASE_NAME: FlaxClient Beta 1.0
      SOURCE_SHA: de75cbdc25f1856f0da711253d222b8c6bf29d37
      BASE_SHA: 3dfed3c6d763e613394f30248304f1c84b3b3bc5
      ARTIFACT_RUN_ID: '30828655071'
      ARTIFACT_NAME: FlaxClient-Lunar-Single-EXE-Windows-x64
    steps:
      - name: Download verified release build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact
          exe_path="$(find release-artifact -type f -iname '*.exe' -print -quit)"
          test -n "$exe_path"
          cp "$exe_path" FlaxClient-Beta-1.0.exe
          sha256sum FlaxClient-Beta-1.0.exe | tee FlaxClient-Beta-1.0.sha256

      - name: Create release snapshot without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          source_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SOURCE_SHA}" --jq '.tree.sha')"
          jq -n \
            --arg base "$source_tree" \
            '{base_tree:$base,tree:[{path:".github/workflows/build-lunar-injectable.yml",mode:"100644",type:"blob",sha:null}]}' \
            > release-tree.json
          release_tree="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" \
            --input release-tree.json --jq '.sha')"
          jq -n \
            --arg message "FlaxClient Beta 1.0 release snapshot" \
            --arg tree "$release_tree" \
            --arg parent "$BASE_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            > release-commit.json
          release_commit="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            --input release-commit.json --jq '.sha')"
          jq -n \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "$release_commit" \
            '{ref:$ref,sha:$sha}' > release-ref.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --input release-ref.json >/dev/null
          echo "RELEASE_COMMIT=${release_commit}" >> "$GITHUB_ENV"

      - name: Publish as a standard release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # FlaxClient Beta 1.0

          Windows x64 single-file release for Lunar Client 1.8.9.

          ## Highlights
          - Flappy Steve with smoother controls and Minecraft-style visuals
          - Tetris with enhanced effects, plus Snake
          - Improved BedESP defense-block panels and smoother tracking
          - Resizable Ghost module list and updated beginner guide
          - Unified YouTube/Music playback with PiP capped at 60 FPS

          This build is published as a standard GitHub Release.
          EOF

          gh release create "$RELEASE_TAG" \
            FlaxClient-Beta-1.0.exe \
            FlaxClient-Beta-1.0.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          jq -e '
            .name == "FlaxClient Beta 1.0" and
            .draft == false and
            .prerelease == false and
            ([.assets[].name] | sort) == (["FlaxClient-Beta-1.0.exe", "FlaxClient-Beta-1.0.sha256"] | sort)
          ' <<<"$release" >/dev/null
          jq '{name, tag_name, prerelease, draft, html_url, assets: [.assets[].name]}' <<<"$release"

  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Build Lunar-compatible client jar
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" lunarJar --no-daemon --stacktrace
          if (!(Test-Path "build\libs\FlaxClient-Lunar.jar")) {
            throw "FlaxClient-Lunar.jar was not generated"
          }

      - name: Verify Lunar mappings and bundled media tools
        shell: powershell
        run: |
          $jar = "build\libs\FlaxClient-Lunar.jar"
          $bootstrap = & javap -classpath $jar -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          $hooks = & javap -classpath $jar -verbose me.eldodebug.soar.attach.LateHooks 2>&1 | Out-String
          if ($bootstrap -notmatch "net/minecraft/client/Minecraft") {
            throw "AttachBootstrap does not contain Lunar-compatible Minecraft class names"
          }
          if ($hooks -notmatch "net/minecraft/client/gui/GuiIngame") {
            throw "LateHooks does not contain Lunar-compatible Minecraft class names"
          }
          $entries = & jar tf $jar
          if ($entries -notcontains "assets/minecraft/soar/tools/windows-x64/yt-dlp.exe") {
            throw "Bundled yt-dlp resource is missing"
          }
          if ($entries -notcontains "assets/minecraft/soar/tools/windows-x64/ffmpeg.zip") {
            throw "Bundled ffmpeg resource is missing"
          }
          if ($entries -notcontains "me/eldodebug/soar/gui/modmenu/BeginnerGuideOverlay.class") {
            throw "Beginner guide class is missing"
          }

      - name: Configure Lunar single-EXE build
        shell: powershell
        run: |
          $jar = (Resolve-Path "build\libs\FlaxClient-Lunar.jar").Path.Replace('\', '/')
          cmake -S attach -B attach/build-lunar -A x64 "-DFLAX_CLIENT_JAR=$jar"

      - name: Build embedded DLL and single EXE
        shell: powershell
        run: cmake --build attach/build-lunar --config Release --target FlaxInjector

      - name: Verify embedded runtime
        shell: powershell
        run: |
          $exe = "attach\build-lunar\bin\Release\FlaxClient.exe"
          $dll = "attach\build-lunar\bin\Release\FlaxClient.dll"
          if (!(Test-Path $exe)) { throw "FlaxClient.exe was not generated" }
          if (!(Test-Path $dll)) { throw "Intermediate FlaxClient.dll was not generated" }
          $verification = Start-Process -FilePath $exe -ArgumentList "--verify-embedded" -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw "The EXE could not verify or extract its embedded DLL" }
          if ((Get-Item $exe).Length -le (Get-Item $dll).Length) {
            throw "The final EXE does not appear to contain the DLL resource"
          }
          Get-FileHash $exe -Algorithm SHA256

      - name: Stage one-file distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build\single-exe" | Out-Null
          Copy-Item "attach\build-lunar\bin\Release\FlaxClient.exe" "build\single-exe\FlaxClient.exe"
          $files = @(Get-ChildItem "build\single-exe" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "FlaxClient.exe") {
            throw "Distribution must contain exactly one FlaxClient.exe"
          }

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-Lunar-Single-EXE-Windows-x64
          path: build/single-exe/FlaxClient.exe
          if-no-files-found: error
          retention-days: 7
