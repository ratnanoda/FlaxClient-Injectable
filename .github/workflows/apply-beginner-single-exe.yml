name: Apply beginner guide and single EXE changes

on:
  push:
    branches:
      - chatgpt/beginner-guide-single-exe-20260803
  pull_request:
    branches:
      - chatgpt/unify-youtube-music-20260803

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/beginner-guide-single-exe-20260803
          fetch-depth: 0
      - name: Apply source changes
        run: python tools/apply_beginner_single_exe.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/me/eldodebug/soar/gui/modmenu/GuiModMenu.java \
                  attach/CMakeLists.txt \
                  attach/src/FlaxInjector.cpp \
                  .github/workflows/build-lunar-injectable.yml
          git commit -m "Add beginner guide and single-file injector"
          git push origin HEAD:chatgpt/beginner-guide-single-exe-20260803
