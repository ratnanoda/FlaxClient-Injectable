name: Release Public Single-File Injector

on:
  push:
    branches:
      - chatgpt/games-overhaul-20260803
    paths:
      - .github/workflows/release-public-single-file.yml

permissions:
  contents: write
  statuses: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      RELEASE_TAG: v2026.08.03.1
      RELEASE_TITLE: FlaxClient Single-File Injector - Lunar 1.8.9
      RELEASE_ASSET: FlaxInjector-Public-Single-File-Lunar-1.8.9.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark release pending
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=pending `
            -f context=release/single-file `
            -f description="Building the single-file release"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Lunar-compatible client jar
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" lunarJar --no-daemon --stacktrace
          if (!(Test-Path "build\libs\FlaxClient-Lunar.jar")) {
            throw "FlaxClient-Lunar.jar was not generated"
          }

      - name: Verify runtime classes
        shell: powershell
        run: |
          $bootstrap = & javap -classpath "build\libs\FlaxClient-Lunar.jar" -verbose me.eldodebug.soar.attach.AttachBootstrap 2>&1 | Out-String
          if ($bootstrap -notmatch "prepareForAttach") {
            throw "AttachBootstrap is not re-injection aware"
          }
          $entries = & jar tf "build\libs\FlaxClient-Lunar.jar" | Out-String
          foreach ($entry in @(
            "TetrisScene.class",
            "DejectBridge.class",
            "GuiDejectScreen.class",
            "MediaToolResolver.class",
            "MusicManager.class",
            "YouTubeManager.class"
          )) {
            if ($entries -notmatch [Regex]::Escape($entry)) {
              throw "Missing class in Lunar jar: $entry"
            }
          }

      - name: Build native DLL and injector
        shell: powershell
        run: |
          $jar = (Resolve-Path "build\libs\FlaxClient-Lunar.jar").Path.Replace('\', '/')
          cmake -S attach -B attach/build-release -A x64 "-DFLAX_CLIENT_JAR=$jar"
          cmake --build attach/build-release --config Release
          foreach ($file in @(
            "attach\build-release\bin\Release\FlaxClient.dll",
            "attach\build-release\bin\Release\FlaxInjector.exe"
          )) {
            if (!(Test-Path $file)) { throw "Missing native output: $file" }
          }

      - name: Download media runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $PWD "build\media-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile (Join-Path $tools "yt-dlp.exe")

          $denoZip = Join-Path $env:RUNNER_TEMP "deno.zip"
          $denoExtract = Join-Path $env:RUNNER_TEMP "deno"
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile $denoZip
          Expand-Archive -Path $denoZip -DestinationPath $denoExtract -Force
          Copy-Item (Join-Path $denoExtract "deno.exe") (Join-Path $tools "deno.exe")

          $ffmpegZip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpeg = Get-ChildItem $ffmpegExtract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem $ffmpegExtract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) {
            throw "The FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe"
          }
          Copy-Item $ffmpeg.FullName (Join-Path $tools "ffmpeg.exe")
          Copy-Item $ffprobe.FullName (Join-Path $tools "ffprobe.exe")

          & (Join-Path $tools "yt-dlp.exe") --version
          & (Join-Path $tools "deno.exe") --version
          & (Join-Path $tools "ffmpeg.exe") -version
          & (Join-Path $tools "ffprobe.exe") -version

      - name: Stage embedded runtime
        shell: powershell
        run: |
          $package = "build\embedded-runtime"
          New-Item -ItemType Directory -Force -Path "$package\tools" | Out-Null
          Copy-Item "attach\build-release\bin\Release\FlaxClient.dll" "$package\FlaxClient.dll"
          Copy-Item "attach\build-release\bin\Release\FlaxInjector.exe" "$package\FlaxInjector.exe"
          Copy-Item "build\media-tools\yt-dlp.exe" "$package\tools\yt-dlp.exe"
          Copy-Item "build\media-tools\deno.exe" "$package\tools\deno.exe"
          Copy-Item "build\media-tools\ffmpeg.exe" "$package\tools\ffmpeg.exe"
          Copy-Item "build\media-tools\ffprobe.exe" "$package\tools\ffprobe.exe"
          @"
          FlaxClient public single-file package for Lunar Client OptiFine 1.8.9.

          The outer executable extracts this runtime into LocalAppData and launches
          the included injector. No password or account authentication is required.

          Start injection after the Lunar 1.8.9 main menu is visible.
          "@ | Set-Content -Encoding UTF8 "$package\README.txt"

          $required = @(
            "$package\FlaxClient.dll",
            "$package\FlaxInjector.exe",
            "$package\tools\yt-dlp.exe",
            "$package\tools\deno.exe",
            "$package\tools\ffmpeg.exe",
            "$package\tools\ffprobe.exe"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing runtime file: $file" }
          }

          $bundle = "build\FlaxClient-runtime.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $bundle -CompressionLevel Optimal -Force
          if ((Get-Item $bundle).Length -lt 100000000) {
            throw "Runtime bundle is unexpectedly small"
          }

      - name: Build single-file launcher stub
        shell: powershell
        run: |
          $source = @'
          package main

          import (
              "archive/zip"
              "crypto/sha256"
              "encoding/binary"
              "encoding/hex"
              "errors"
              "fmt"
              "io"
              "os"
              "os/exec"
              "path/filepath"
              "strings"
              "syscall"
              "unsafe"
          )

          const footerSize int64 = 64
          const magic = "FLAXPKG1PUBLIC!!"

          var requiredEntries = []string{
              "FlaxClient.dll",
              "FlaxInjector.exe",
              "tools/yt-dlp.exe",
              "tools/deno.exe",
              "tools/ffmpeg.exe",
              "tools/ffprobe.exe",
          }

          type bundleInfo struct {
              offset int64
              length int64
              hash   [32]byte
          }

          func main() {
              if err := run(); err != nil {
                  logError(err)
                  messageBox("FlaxClient Launcher", err.Error())
                  os.Exit(1)
              }
          }

          func run() error {
              exe, err := os.Executable()
              if err != nil { return fmt.Errorf("cannot resolve launcher path: %w", err) }
              exe, err = filepath.Abs(exe)
              if err != nil { return err }

              f, info, err := readBundleInfo(exe)
              if err != nil { return err }
              defer f.Close()

              zr, err := zip.NewReader(io.NewSectionReader(f, info.offset, info.length), info.length)
              if err != nil { return fmt.Errorf("cannot open embedded runtime: %w", err) }
              if err := verifyEntries(zr); err != nil { return err }

              if len(os.Args) > 1 && os.Args[1] == "--verify-bundle" {
                  return nil
              }

              local := os.Getenv("LOCALAPPDATA")
              if local == "" { return errors.New("LOCALAPPDATA is unavailable") }
              version := "v2026.08.03.1-" + hex.EncodeToString(info.hash[:6])
              target := filepath.Join(local, "FlaxClient", "runtime", version)
              marker := filepath.Join(target, ".bundle.sha256")
              expected := hex.EncodeToString(info.hash[:])

              ready, err := runtimeReady(target, marker, expected)
              if err != nil { return err }
              if !ready {
                  if err := extractBundle(zr, target, marker, expected); err != nil { return err }
              }

              injector := filepath.Join(target, "FlaxInjector.exe")
              cmd := exec.Command(injector, os.Args[1:]...)
              cmd.Dir = target
              return cmd.Run()
          }

          func readBundleInfo(path string) (*os.File, bundleInfo, error) {
              var info bundleInfo
              f, err := os.Open(path)
              if err != nil { return nil, info, err }
              st, err := f.Stat()
              if err != nil { f.Close(); return nil, info, err }
              if st.Size() < footerSize { f.Close(); return nil, info, errors.New("embedded runtime footer is missing") }

              footer := make([]byte, footerSize)
              if _, err := f.ReadAt(footer, st.Size()-footerSize); err != nil {
                  f.Close(); return nil, info, err
              }
              if string(footer[:16]) != magic {
                  f.Close(); return nil, info, errors.New("embedded runtime signature is invalid")
              }
              info.offset = int64(binary.LittleEndian.Uint64(footer[16:24]))
              info.length = int64(binary.LittleEndian.Uint64(footer[24:32]))
              copy(info.hash[:], footer[32:64])
              if info.offset < 0 || info.length <= 0 || info.offset+info.length+footerSize != st.Size() {
                  f.Close(); return nil, info, errors.New("embedded runtime bounds are invalid")
              }

              h := sha256.New()
              if _, err := io.Copy(h, io.NewSectionReader(f, info.offset, info.length)); err != nil {
                  f.Close(); return nil, info, err
              }
              actual := h.Sum(nil)
              if !equalBytes(actual, info.hash[:]) {
                  f.Close(); return nil, info, errors.New("embedded runtime SHA-256 verification failed")
              }
              return f, info, nil
          }

          func verifyEntries(zr *zip.Reader) error {
              found := make(map[string]bool)
              for _, zf := range zr.File {
                  found[strings.ReplaceAll(zf.Name, "\\", "/")] = true
              }
              for _, name := range requiredEntries {
                  if !found[name] { return fmt.Errorf("embedded runtime is missing %s", name) }
              }
              return nil
          }

          func runtimeReady(target, marker, expected string) (bool, error) {
              data, err := os.ReadFile(marker)
              if err != nil {
                  if os.IsNotExist(err) { return false, nil }
                  return false, err
              }
              if strings.TrimSpace(string(data)) != expected { return false, nil }
              for _, name := range requiredEntries {
                  path := filepath.Join(target, filepath.FromSlash(name))
                  st, err := os.Stat(path)
                  if err != nil || st.IsDir() || st.Size() == 0 { return false, nil }
              }
              return true, nil
          }

          func extractBundle(zr *zip.Reader, target, marker, expected string) error {
              temp := fmt.Sprintf("%s.tmp-%d", target, os.Getpid())
              _ = os.RemoveAll(temp)
              if err := os.MkdirAll(temp, 0755); err != nil { return err }
              failed := true
              defer func() { if failed { _ = os.RemoveAll(temp) } }()

              for _, zf := range zr.File {
                  clean := filepath.Clean(filepath.FromSlash(zf.Name))
                  if clean == "." || filepath.IsAbs(clean) || clean == ".." || strings.HasPrefix(clean, ".."+string(os.PathSeparator)) {
                      return fmt.Errorf("unsafe embedded path: %s", zf.Name)
                  }
                  dst := filepath.Join(temp, clean)
                  rel, err := filepath.Rel(temp, dst)
                  if err != nil || rel == ".." || strings.HasPrefix(rel, ".."+string(os.PathSeparator)) {
                      return fmt.Errorf("unsafe embedded path: %s", zf.Name)
                  }
                  if zf.FileInfo().IsDir() {
                      if err := os.MkdirAll(dst, 0755); err != nil { return err }
                      continue
                  }
                  if err := os.MkdirAll(filepath.Dir(dst), 0755); err != nil { return err }
                  src, err := zf.Open()
                  if err != nil { return err }
                  out, err := os.OpenFile(dst, os.O_CREATE|os.O_TRUNC|os.O_WRONLY, 0755)
                  if err != nil { src.Close(); return err }
                  _, copyErr := io.Copy(out, src)
                  closeErr := out.Close()
                  srcErr := src.Close()
                  if copyErr != nil { return copyErr }
                  if closeErr != nil { return closeErr }
                  if srcErr != nil { return srcErr }
              }

              if err := os.WriteFile(filepath.Join(temp, ".bundle.sha256"), []byte(expected+"\n"), 0644); err != nil { return err }
              _ = os.RemoveAll(target)
              if err := os.MkdirAll(filepath.Dir(target), 0755); err != nil { return err }
              if err := os.Rename(temp, target); err != nil {
                  ready, readyErr := runtimeReady(target, marker, expected)
                  if readyErr == nil && ready {
                      _ = os.RemoveAll(temp)
                      failed = false
                      return nil
                  }
                  return err
              }
              failed = false
              return nil
          }

          func equalBytes(a, b []byte) bool {
              if len(a) != len(b) { return false }
              var v byte
              for i := range a { v |= a[i] ^ b[i] }
              return v == 0
          }

          func logError(err error) {
              dir := filepath.Join(os.TempDir(), "FlaxClient")
              _ = os.MkdirAll(dir, 0755)
              f, openErr := os.OpenFile(filepath.Join(dir, "launcher.log"), os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0644)
              if openErr != nil { return }
              defer f.Close()
              _, _ = fmt.Fprintln(f, err.Error())
          }

          func messageBox(title, text string) {
              user32 := syscall.NewLazyDLL("user32.dll")
              proc := user32.NewProc("MessageBoxW")
              t, _ := syscall.UTF16PtrFromString(title)
              m, _ := syscall.UTF16PtrFromString(text)
              _, _, _ = proc.Call(0, uintptr(unsafe.Pointer(m)), uintptr(unsafe.Pointer(t)), 0x10)
          }
          '@

          $sourcePath = Join-Path $env:RUNNER_TEMP "single_file_launcher.go"
          [System.IO.File]::WriteAllText($sourcePath, $source, (New-Object System.Text.UTF8Encoding($false)))
          $stub = "build\FlaxLauncherStub.exe"
          go build -trimpath -ldflags "-s -w -H windowsgui" -o $stub $sourcePath
          if (!(Test-Path $stub)) { throw "Launcher stub was not generated" }

      - name: Assemble and verify single executable
        shell: powershell
        run: |
          $stub = (Resolve-Path "build\FlaxLauncherStub.exe").Path
          $bundle = (Resolve-Path "build\FlaxClient-runtime.zip").Path
          $outputDir = "build\release-output"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $output = Join-Path $outputDir $env:RELEASE_ASSET
          Copy-Item $stub $output -Force

          $offset = (Get-Item $output).Length
          $length = (Get-Item $bundle).Length
          $bundleHash = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashBytes = New-Object byte[] 32
          for ($i = 0; $i -lt 32; $i++) {
            $hashBytes[$i] = [Convert]::ToByte($bundleHash.Substring($i * 2, 2), 16)
          }

          $stream = [System.IO.File]::Open($output, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try {
            $input = [System.IO.File]::OpenRead($bundle)
            try { $input.CopyTo($stream) } finally { $input.Dispose() }
            $magic = [System.Text.Encoding]::ASCII.GetBytes("FLAXPKG1PUBLIC!!")
            $offsetBytes = [BitConverter]::GetBytes([UInt64]$offset)
            $lengthBytes = [BitConverter]::GetBytes([UInt64]$length)
            $stream.Write($magic, 0, $magic.Length)
            $stream.Write($offsetBytes, 0, $offsetBytes.Length)
            $stream.Write($lengthBytes, 0, $lengthBytes.Length)
            $stream.Write($hashBytes, 0, $hashBytes.Length)
          } finally {
            $stream.Dispose()
          }

          $result = Start-Process -FilePath $output -ArgumentList "--verify-bundle" -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            throw "Single-file verification failed with exit code $($result.ExitCode)"
          }
          $size = (Get-Item $output).Length
          if ($size -lt 100000000) { throw "Final executable is unexpectedly small" }
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:RELEASE_ASSET" | Set-Content -Encoding ASCII "$outputDir\SHA256SUMS.txt"
          Write-Host "Release asset size: $size bytes"
          Write-Host "Release asset SHA-256: $hash"

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outputDir = "build\release-output"
          $asset = Join-Path $outputDir $env:RELEASE_ASSET
          $sums = Join-Path $outputDir "SHA256SUMS.txt"
          $notes = Join-Path $outputDir "RELEASE_NOTES.md"
          @"
          ## FlaxClient single-file build

          Windows x64 build for Lunar Client OptiFine 1.8.9.

          The downloadable executable contains the injector, FlaxClient DLL, yt-dlp,
          Deno, FFmpeg, and FFprobe. It is not password-protected and does not require
          a separate DLL or tools folder.

          On first launch, the embedded runtime is verified with SHA-256 and extracted
          under `%LOCALAPPDATA%\FlaxClient\runtime\`. Later launches reuse that cache.

          Start injection after the Lunar 1.8.9 main menu is visible.

          This executable is currently unsigned, so Windows SmartScreen or antivirus
          software may display a warning. No warning-bypass behavior is included.
          "@ | Set-Content -Encoding UTF8 $notes

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset $sums --clobber --repo "${{ github.repository }}"
            gh release edit $env:RELEASE_TAG `
              --title $env:RELEASE_TITLE `
              --notes-file $notes `
              --latest `
              --repo "${{ github.repository }}"
          } else {
            gh release create $env:RELEASE_TAG $asset $sums `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes-file $notes `
              --latest `
              --repo "${{ github.repository }}"
          }

      - name: Publish final release status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if ($env:JOB_RESULT -eq "success") {
            $state = "success"
            $description = "Single-file release published"
            $target = "https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
          } else {
            $state = "failure"
            $description = "Single-file release failed"
            $target = "https://github.com/${{ github.repository }}/actions"
          }
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=$state `
            -f context=release/single-file `
            -f description=$description `
            -f target_url=$target
