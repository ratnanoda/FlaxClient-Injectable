name: Watch Single-File Release

on:
  push:
    branches:
      - chatgpt/games-overhaul-20260803
    paths:
      - .github/workflows/watch-single-file-release.yml
  workflow_dispatch:

permissions:
  actions: read
  statuses: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TARGET_SHA: 5a7d14dccca2fdb1df8c6098e3b87954ea1d24d3
      TARGET_WORKFLOW: release-existing-artifact.yml
      TARGET_BRANCH: chatgpt/games-overhaul-20260803
      STATUS_CONTEXT: release/single-file
    steps:
      - name: Wait for release workflow and publish status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="${3:-https://github.com/${{ github.repository }}/actions}"
            gh api "repos/${{ github.repository }}/statuses/${TARGET_SHA}" \
              -f state="$state" \
              -f context="$STATUS_CONTEXT" \
              -f description="$description" \
              -f target_url="$target_url" >/dev/null
          }

          post_status pending "Waiting for the single-file release workflow"

          for attempt in $(seq 1 150); do
            response="$(gh api "repos/${{ github.repository }}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&event=push&per_page=30")"
            run="$(jq -c --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha)' <<<"$response" | head -n 1)"

            if [[ -z "$run" ]]; then
              sleep 10
              continue
            fi

            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            url="$(jq -r '.html_url' <<<"$run")"
            run_id="$(jq -r '.id' <<<"$run")"

            if [[ "$status" != "completed" ]]; then
              post_status pending "Release workflow is ${status} (run ${run_id})" "$url"
              sleep 10
              continue
            fi

            if [[ "$conclusion" == "success" ]]; then
              post_status success "Single-file GitHub Release published" "$url"
              exit 0
            fi

            post_status failure "Release workflow finished: ${conclusion}" "$url"
            exit 1
          done

          post_status error "Timed out waiting for the release workflow"
          exit 1
