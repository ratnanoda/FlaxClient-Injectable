name: Apply BedESP PiP and tutorial polish

on:
  push:
    branches:
      - chatgpt/beginner-guide-single-exe-20260803
    paths:
      - tools/apply_bedesp_pip_tutorial_polish.py
      - .github/workflows/apply-bedesp-pip-tutorial-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/beginner-guide-single-exe-20260803
          fetch-depth: 0
      - name: Apply source changes
        run: python tools/apply_bedesp_pip_tutorial_polish.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/me/eldodebug/soar/management/mods/impl/BedESPMod.java \
                  src/main/java/me/eldodebug/soar/management/youtube/YouTubeManager.java \
                  src/main/java/me/eldodebug/soar/gui/modmenu/category/impl/ModuleCategory.java
          git commit -m "Redesign BedESP icons and cap PiP at 60 FPS"
          git push origin HEAD:chatgpt/beginner-guide-single-exe-20260803
