name: Build Flappy Glide source package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Build injectable package
        shell: powershell
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          & ".\gradlew.bat" attachPackage --no-daemon --stacktrace

      - name: Verify package
        shell: powershell
        run: |
          if (!(Test-Path build\attach\FlaxInjector.exe)) { throw "FlaxInjector.exe was not generated" }
          if (!(Test-Path build\attach\FlaxClient.dll)) { throw "FlaxClient.dll was not generated" }
          Get-FileHash build\attach\FlaxInjector.exe -Algorithm SHA256
          Get-FileHash build\attach\FlaxClient.dll -Algorithm SHA256

      - name: Add usage notes
        shell: powershell
        run: |
          @"
          Flappy Glide Minecraft-style source build

          This package retains the repository's original injector behavior.
          It may be injected from the main menu, a local world, or while connected to a server.

          Keep FlaxInjector.exe and FlaxClient.dll in the same folder.
          "@ | Set-Content -Encoding UTF8 build\attach\README.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FlaxClient-MinecraftFlappy-Source-Windows-x64
          path: build/attach/*
          if-no-files-found: error
          retention-days: 7
