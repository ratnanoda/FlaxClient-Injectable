buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
//            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        maven {
            url = 'https://jitpack.io'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.tweaker-client'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

version = "Release"
group= "me.eldodebug"
archivesBaseName = "FlaxClient"

def buildNumberFile = file("build-number.txt")

def readBuildNumber = {
    if(!buildNumberFile.exists()) {
        buildNumberFile.text = "0\n"
    }
    return buildNumberFile.text.trim().toInteger()
}

ext.currentBuildNumber = readBuildNumber()
ext.clientVersionName = "Releases 1.0"

task bumpBuildNumber {
    doLast {
        def next = readBuildNumber() + 1
        buildNumberFile.text = "${next}\n"
        project.ext.currentBuildNumber = next
        println "FlaxClient build number: ${next}"
    }
}

ext.devVersionName = project.ext.clientVersionName
def generatedVersionSourceDir = file("$buildDir/generated/sources/version/java")

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.memoryInitialSize = '1024m'
    options.forkOptions.memoryMaximumSize = '4096m'
    options.forkOptions.jvmArgs += ['-XX:-UseGCOverheadLimit']
}

sourceSets.main.java.srcDir generatedVersionSourceDir

task generateBuildVersionSource {
    dependsOn bumpBuildNumber
    inputs.file(buildNumberFile)
    outputs.file("$generatedVersionSourceDir/me/eldodebug/soar/BuildVersion.java")
    doLast {
        def latest = readBuildNumber()
        project.ext.currentBuildNumber = latest
        project.ext.devVersionName = project.ext.clientVersionName
        def outFile = file("$generatedVersionSourceDir/me/eldodebug/soar/BuildVersion.java")
        outFile.parentFile.mkdirs()
        outFile.text = """package me.eldodebug.soar;

public final class BuildVersion {
    public static final int BUILD_NUMBER = ${latest};
    public static final String DISPLAY_VERSION = "${project.ext.devVersionName}";

    private BuildVersion() {}
}
"""
    }
}

// Rebuild the native mouse-input shared library from src/main/native/linux/flax_mouse.c
// and drop it into the resources tree so processResources bundles it into the jar.
task buildNativeMouseLinux {
    def source = file("src/main/native/linux/flax_mouse.c")
    def outDir = file("src/main/resources/native/linux-x64")
    def outFile = file("$outDir/libflaxmouse.so")
    inputs.file(source)
    outputs.file(outFile)
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isLinux() }
    doLast {
        outDir.mkdirs()
        def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
        def include1 = new File(javaHome, "include")
        def include2 = new File(javaHome, "include/linux")
        if(!new File(include1, "jni.h").exists()) {
            def candidate = new File("/usr/lib/jvm/java-8-openjdk-amd64")
            if(new File(candidate, "include/jni.h").exists()) {
                include1 = new File(candidate, "include")
                include2 = new File(candidate, "include/linux")
            }
        }
        exec {
            commandLine 'gcc', '-shared', '-fPIC', '-O2', '-Wall',
                "-I${include1.absolutePath}", "-I${include2.absolutePath}",
                '-o', outFile.absolutePath, source.absolutePath
        }
        println "FlaxClient native mouse library built: ${outFile}"
    }
}

processResources.dependsOn buildNativeMouseLinux

def windowsYtDlp = file("FlaxClientLauncher/assets/tools/yt-dlp-windows-x86_64.exe")
def windowsFfmpegArchive = file("FlaxClientLauncher/assets/tools/ffmpeg-windows-x86_64.zip")
def bundledWindowsToolPath = "assets/minecraft/soar/tools/windows-x64"

minecraft {
    version = "1.8.9"
    tweakClass = "me.eldodebug.soar.injection.mixin.GlideTweaker"
    runDir = "run"
    mappings = "stable_22"
    clientJvmArgs = ["-XX:-DisableExplicitGC"]
    makeObfSourceJar = false
}

repositories {
    maven {
        name "minecraftLibraries"
        url "https://libraries.minecraft.net"
    }

    maven {
        name "jitpack"
        url "https://jitpack.io"
    }

    maven {
        name "spongepowered"
        url "https://repo.spongepowered.org/maven/"
    }
    jcenter()
    mavenCentral()
}

configurations {
    embed
    asmRuntime
    compile.extendsFrom(embed, asmRuntime)
}

dependencies {
    // Embedded MP3 decoder used by the in-client Music player.
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude group: 'org.ow2.asm'
    }
    // ASM 9 is required to transform Lunar's Java 17 (classfile v61) classes.
    // These jars are merged after ForgeGradle's legacy ASM reobfuscation pass.
    asmRuntime('org.ow2.asm:asm:9.7.1')
    asmRuntime('org.ow2.asm:asm-tree:9.7.1')
    asmRuntime('org.ow2.asm:asm-analysis:9.7.1')
    asmRuntime('org.ow2.asm:asm-commons:9.7.1')
    asmRuntime('org.ow2.asm:asm-util:9.7.1')
    embed(files('libs/lwjgl-soar.jar'))
    embed(files('libs/lwjgl-soar-natives.jar'))
}

mixin {
    defaultObfuscationEnv = "notch"
    add sourceSets.main, "mixins.soar.refmap.json"
}

processResources {
    inputs.files "src/main/resources"
    inputs.file windowsYtDlp
    inputs.file windowsFfmpegArchive
    outputs.dir "build/classes/main"
    copy {
        from("src/main/resources")
        into("build/classes/main")
    }
    copy {
        from(windowsYtDlp) {
            rename { "yt-dlp.exe" }
        }
        from(windowsFfmpegArchive) {
            rename { "ffmpeg.zip" }
        }
        into("build/classes/main/${bundledWindowsToolPath}")
    }
}

jar {
    dependsOn configurations.compile
    from {
        configurations.embed.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    from(windowsYtDlp) {
        into bundledWindowsToolPath
        rename { "yt-dlp.exe" }
    }
    from(windowsFfmpegArchive) {
        into bundledWindowsToolPath
        rename { "ffmpeg.zip" }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

jar {
    manifest.attributes(
            "MixinConfigs": 'mixins.soar.json',
            "TweakClass": 'me.eldodebug.soar.injection.mixin.GlideTweaker',
            "TweakOrder": 0,
            "Manifest-Version": 1.0,
            'FMLAT': 'soar_at.cfg'
    )

    configurations.embed.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }

    doFirst {
        def latest = readBuildNumber()
        project.ext.currentBuildNumber = latest
        project.ext.devVersionName = project.ext.clientVersionName
        manifest.attributes("Implementation-Version": project.ext.devVersionName)
    }
}

task lunarJar(type: Jar) {
    dependsOn classes
    archiveName = "FlaxClient-Lunar.jar"
    from sourceSets.main.output
    from(windowsYtDlp) {
        into bundledWindowsToolPath
        rename { "yt-dlp.exe" }
    }
    from(windowsFfmpegArchive) {
        into bundledWindowsToolPath
        rename { "ffmpeg.zip" }
    }
    from {
        (configurations.embed + configurations.asmRuntime).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF', 'META-INF/**'
    exclude 'module-info.class'
    manifest.attributes(
            "MixinConfigs": 'mixins.soar.json',
            "TweakClass": 'me.eldodebug.soar.injection.mixin.GlideTweaker',
            "TweakOrder": 0,
            "Manifest-Version": 1.0,
            'FMLAT': 'soar_at.cfg',
            "Implementation-Version": project.ext.clientVersionName
    )
}

// Dawn/Feather-style 1.8.9 keeps the readable net/minecraft class names but
// uses SRG field/method names. Build a separate jar and ask ForgeGradle 2.1 to
// remap MCP -> SEARGE rather than the tweaker plugin's normal MCP -> NOTCH jar.
task dawnJar(type: Jar) {
    dependsOn classes, "genSrgs"
    archiveName = "FlaxClient-Dawn.jar"
    from sourceSets.main.output
    from({ tasks.getByName("genSrgs").mcpToSrg }) {
        into "flax/mappings"
        rename { "mcp-srg.srg" }
    }
    from(windowsYtDlp) {
        into bundledWindowsToolPath
        rename { "yt-dlp.exe" }
    }
    from(windowsFfmpegArchive) {
        into bundledWindowsToolPath
        rename { "ffmpeg.zip" }
    }
    from {
        configurations.embed.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF', 'META-INF/**'
    exclude 'module-info.class'
    manifest.attributes(
            "MixinConfigs": 'mixins.soar.json',
            "TweakClass": 'me.eldodebug.soar.injection.mixin.GlideTweaker',
            "TweakOrder": 0,
            "Manifest-Version": 1.0,
            'FMLAT': 'soar_at.cfg',
            "Implementation-Version": project.ext.clientVersionName
    )
}

reobf {
    dawnJar {
        mappingType = "SEARGE"
    }
}

reobfJar.doLast {
    def outputJar = tasks.getByName("jar").archivePath
    configurations.asmRuntime.each { dependency ->
        ant.zip(destfile: outputJar, update: true) {
            zipfileset(
                    src: dependency,
                    excludes: 'META-INF,META-INF/**,module-info.class')
        }
    }
}

reobfDawnJar.doLast {
    def outputJar = tasks.getByName("dawnJar").archivePath
    configurations.asmRuntime.each { dependency ->
        ant.zip(destfile: outputJar, update: true) {
            zipfileset(
                    src: dependency,
                    excludes: 'META-INF,META-INF/**,module-info.class')
        }
    }
}

compileJava.dependsOn generateBuildVersionSource

bumpBuildNumber.doLast {
    project.ext.devVersionName = project.ext.clientVersionName
}

def findCmakeExecutable = {
    def configured = System.getenv("CMAKE_EXE")
    if(configured && file(configured).exists()) {
        return file(configured)
    }

    def commandName = org.gradle.internal.os.OperatingSystem.current().isWindows()
            ? "cmake.exe"
            : "cmake"
    def pathEntries = (System.getenv("PATH") ?: "").split(File.pathSeparator)
    def fromPath = pathEntries.collect { new File(it, commandName) }.find { it.exists() }
    if(fromPath != null) {
        return fromPath
    }

    if(org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        def installations = fileTree("C:/Program Files/Microsoft Visual Studio") {
            include "*/**/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe"
        }.files
        if(!installations.isEmpty()) {
            return installations.sort { a, b -> b.absolutePath <=> a.absolutePath }.first()
        }
    }

    throw new GradleException("CMake was not found. Install the Visual Studio C++ CMake tools or set CMAKE_EXE.")
}

task configureAttachDll(type: Exec) {
    dependsOn lunarJar, reobfDawnJar
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    doFirst {
        commandLine findCmakeExecutable().absolutePath,
                "-S", file("attach").absolutePath,
                "-B", file("attach/build").absolutePath,
                "-A", "x64",
                "-DFLAX_CLIENT_LUNAR_JAR=${tasks.lunarJar.archivePath.absolutePath}",
                "-DFLAX_CLIENT_DAWN_JAR=${tasks.dawnJar.archivePath.absolutePath}"
    }
}

task buildAttachDll(type: Exec) {
    dependsOn configureAttachDll
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    doFirst {
        commandLine findCmakeExecutable().absolutePath,
                "--build", file("attach/build").absolutePath,
                "--config", "Release"
    }
}

task attachPackage(type: Sync) {
    dependsOn buildAttachDll
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    // FlaxClient.exe embeds FlaxClient.dll; the DLL embeds both the Lunar MCP
    // and Dawn/Feather-style SRG 1.8.9 client jars.
    from "attach/build/bin/Release/FlaxClient.exe"
    into "$buildDir/attach"
}
